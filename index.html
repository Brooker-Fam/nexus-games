<!DOCTYPE html>
<!-- Kitty Games - root landing page -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KITTY GAMES</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script>
  if(location.protocol!=='file:'){
    const l=document.createElement('link');
    l.rel='stylesheet';
    l.href='https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Rajdhani:wght@400;600&display=swap';
    document.head.appendChild(l);
  }
</script>
<style>
  :root {
    --bg-deep: #10081a;
    --bg-mid: #1a0e2b;
    --neon-pink: #ff5fd8;
    --neon-purple: #b06bff;
    --neon-yellow: #ffe066;
    --text-bright: #fdf3ff;
    --text-dim: rgba(253,243,255,0.6);
    --panel-bg: rgba(40,16,58,0.7);
    --panel-border: rgba(255,95,216,0.3);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: radial-gradient(circle at 50% 20%, var(--bg-mid), var(--bg-deep));
    color: var(--text-bright);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }
  .card {
    position: relative;
    text-align: center;
    padding: 56px 44px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 24px;
    box-shadow: 0 0 60px rgba(255,95,216,0.15), inset 0 0 40px rgba(176,107,255,0.08);
    max-width: 480px;
    width: calc(100% - 32px);
  }
  .paw {
    font-size: 2.6rem;
    margin-bottom: 8px;
    filter: drop-shadow(0 0 12px var(--neon-pink));
  }
  h1 {
    font-family: 'Baloo 2', sans-serif;
    font-size: 2.6rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    background: linear-gradient(90deg, var(--neon-pink), var(--neon-purple));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .tagline {
    margin-top: 8px;
    color: var(--text-dim);
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-size: 0.85rem;
  }
  .enter-btn {
    display: inline-block;
    margin-top: 36px;
    padding: 16px 38px;
    font-family: 'Baloo 2', sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--bg-deep);
    background: linear-gradient(90deg, var(--neon-yellow), var(--neon-pink));
    border: none;
    border-radius: 999px;
    text-decoration: none;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 0 24px rgba(255,95,216,0.4);
  }
  .enter-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 32px rgba(255,95,216,0.6);
  }
  .sub-note {
    margin-top: 18px;
    font-size: 0.8rem;
    color: var(--text-dim);
  }
</style>
</head>
<body>
<div class="card">
  <div class="paw">🐾</div>
  <h1>KITTY GAMES</h1>
  <div class="tagline">Play &middot; Purr &middot; Repeat</div>
  <a class="enter-btn" href="/nexus/">ENTER NEXUS →</a>
  <div class="sub-note">Nexus Games lives on inside Kitty Games.</div>
</div>
</body>
</html>
