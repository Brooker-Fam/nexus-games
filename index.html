<!DOCTYPE html>
<!-- Kitty Games - root landing page -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KITTY GAMES</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script>
  if(location.protocol!=='file:'){
    const l=document.createElement('link');
    l.rel='stylesheet';
    l.href='https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Rajdhani:wght@400;600&display=swap';
    document.head.appendChild(l);
  }
</script>
<style>
  :root {
    --bg-deep: #ffffff;
    --bg-mid: #f7f1ff;
    --ink: #1a0e2b;
    --neon-coral: #ff6a3d;
    --neon-purple: #b06bff;
    --text-bright: #1a0e2b;
    --text-dim: rgba(26,14,43,0.62);
    --panel-bg: #fbf6ff;
    --panel-border: rgba(176,107,255,0.3);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: radial-gradient(circle at 50% 20%, var(--bg-mid), var(--bg-deep));
    color: var(--text-bright);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    padding: 40px 16px 60px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .shell {
    max-width: 480px;
    width: 100%;
    margin: 0 auto;
  }
  header {
    text-align: center;
    margin-bottom: 32px;
  }
  h1 {
    font-family: 'Baloo 2', sans-serif;
    font-size: 2.4rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    background: linear-gradient(90deg, var(--neon-coral), var(--neon-purple));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .tagline {
    margin-top: 8px;
    color: var(--text-dim);
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-size: 0.85rem;
  }

  .game-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    text-decoration: none;
    color: inherit;
    padding: 40px 28px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 20px;
    box-shadow: 0 0 40px rgba(255,106,61,0.1), inset 0 0 30px rgba(176,107,255,0.06);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .game-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 0 40px rgba(255,106,61,0.3), inset 0 0 30px rgba(176,107,255,0.1);
  }
  .game-icon { font-size: 2.6rem; margin-bottom: 14px; }
  .game-name {
    font-family: 'Baloo 2', sans-serif;
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: 0.03em;
  }
  .game-desc {
    margin-top: 10px;
    color: var(--text-dim);
    font-size: 0.9rem;
    line-height: 1.4;
  }
  .game-play {
    margin-top: 20px;
    padding: 10px 28px;
    font-family: 'Baloo 2', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--ink);
    background: linear-gradient(90deg, var(--neon-yellow, #e6b800), var(--neon-coral));
    border-radius: 999px;
  }
  .site-logo {
    position: fixed;
    top: 16px;
    left: 16px;
    height: 56px;
    width: auto;
    padding: 4px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(26,14,43,0.12);
    z-index: 10;
  }
  @media (max-width: 480px) {
    .site-logo { height: 40px; top: 10px; left: 10px; }
  }
</style>
</head>
<body>
<img class="site-logo" src="/assets/kitty-games-logo.webp" alt="Kitty Games logo">
<div class="shell">
  <header>
    <h1>KITTY GAMES</h1>
    <div class="tagline">Arcade &middot; Strategy &middot; Beyond</div>
  </header>

  <a class="game-card" href="/nexus/">
    <div class="game-icon">⬡</div>
    <div class="game-name">NEXUS GAMES</div>
    <div class="game-desc">Tower defense, real-time strategy, camera-tracked taekwondo, and an illustrated story mode — all in one arcade.</div>
    <span class="game-play">PLAY →</span>
  </a>
</div>
</body>
</html>
