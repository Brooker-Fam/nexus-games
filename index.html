<!DOCTYPE html>
<!-- Kitty Games - root landing page -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KITTY GAMES</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script>
  if(location.protocol!=='file:'){
    const l=document.createElement('link');
    l.rel='stylesheet';
    l.href='https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Rajdhani:wght@400;600&display=swap';
    document.head.appendChild(l);
  }
</script>
<style>
  :root {
    --bg-deep: #ffffff;
    --bg-mid: #f7f1ff;
    --ink: #1a0e2b;
    --neon-coral: #ff6a3d;
    --neon-purple: #b06bff;
    --text-bright: #1a0e2b;
    --text-dim: rgba(26,14,43,0.62);
    --panel-bg: #fbf6ff;
    --panel-border: rgba(176,107,255,0.3);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: radial-gradient(circle at 50% 20%, var(--bg-mid), var(--bg-deep));
    color: var(--text-bright);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    padding: 40px 16px 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }
  .shell {
    max-width: 480px;
    width: 100%;
    margin: 0 auto;
  }
  header {
    text-align: center;
    margin-bottom: 32px;
  }
  .tagline {
    margin-top: 8px;
    color: var(--text-dim);
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-size: 0.85rem;
  }

  .tabs {
    display: flex;
    width: 100vw;
    position: relative;
    left: 50%;
    margin-left: -50vw;
    margin-bottom: 28px;
    background: var(--panel-bg);
    border-top: 1px solid var(--panel-border);
    border-bottom: 1px solid var(--panel-border);
    box-shadow: 0 0 40px rgba(255,106,61,0.1), inset 0 0 30px rgba(176,107,255,0.06);
  }
  .tab-btn {
    flex: 1;
    padding: 16px 28px;
    font-family: 'Baloo 2', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    background: transparent;
    border: none;
    cursor: pointer;
    transition: color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  }
  .tab-btn:hover { color: var(--text-bright); }
  .tab-btn.active {
    color: #fff;
    background: linear-gradient(90deg, var(--neon-coral), var(--neon-purple));
    box-shadow: 0 0 24px rgba(255,106,61,0.35);
  }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .membership-empty {
    padding: 40px 28px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 20px;
    text-align: center;
    color: var(--text-dim);
    font-weight: 600;
  }

  @property --spin {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }
  .game-card {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    text-decoration: none;
    color: inherit;
    overflow: hidden;
    border: 2px solid transparent;
    border-radius: 22px;
    background:
      linear-gradient(var(--panel-bg), var(--panel-bg)) padding-box,
      conic-gradient(from var(--spin), var(--neon-coral), var(--neon-purple), #e6b800, var(--neon-coral)) border-box;
    box-shadow: 0 10px 40px rgba(176,107,255,0.18), 0 0 40px rgba(255,106,61,0.12);
    animation: card-spin 6s linear infinite;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  @keyframes card-spin { to { --spin: 360deg; } }
  .game-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 18px 50px rgba(176,107,255,0.32), 0 0 60px rgba(255,106,61,0.25);
  }
  /* light sweep across the card on hover */
  .game-card::after {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    left: -120%;
    width: 40%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,0.45), transparent);
    transform: skewX(-20deg);
    pointer-events: none;
    transition: left 0.6s ease;
  }
  .game-card:hover::after { left: 180%; }

  .game-screen {
    position: relative;
    width: 100%;
    height: 170px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 45%, rgba(176,107,255,0.55), transparent 60%),
      linear-gradient(180deg, #120724 0%, #2a0f4d 70%, #4a1a6e 100%);
  }
  /* retro perspective grid floor */
  .game-screen::before {
    content: '';
    position: absolute;
    left: -50%; right: -50%; bottom: -10px;
    height: 70px;
    background:
      repeating-linear-gradient(90deg, rgba(255,106,61,0.55) 0 1px, transparent 1px 36px),
      repeating-linear-gradient(0deg, rgba(255,106,61,0.55) 0 1px, transparent 1px 14px);
    transform: perspective(160px) rotateX(55deg);
    transform-origin: bottom;
    animation: grid-scroll 1.6s linear infinite;
    mask-image: linear-gradient(to top, #000 30%, transparent);
    -webkit-mask-image: linear-gradient(to top, #000 30%, transparent);
  }
  @keyframes grid-scroll { to { background-position: 0 0, 0 14px; } }
  /* scanlines */
  .game-screen::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 3px);
    pointer-events: none;
  }
  .game-emblem {
    position: relative;
    z-index: 1;
    width: 84px;
    height: 84px;
    filter: drop-shadow(0 0 10px rgba(255,106,61,0.8)) drop-shadow(0 0 22px rgba(176,107,255,0.7));
    animation: emblem-float 3.2s ease-in-out infinite;
  }
  .game-card:hover .game-emblem { animation-duration: 1.2s; }
  @keyframes emblem-float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-6px) rotate(6deg); }
  }

  .game-body { padding: 24px 24px 28px; display: flex; flex-direction: column; align-items: center; }
  .game-name {
    font-family: 'Baloo 2', sans-serif;
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: 0.05em;
    background: linear-gradient(90deg, var(--neon-coral), var(--neon-purple));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .game-desc {
    margin-top: 8px;
    color: var(--text-dim);
    font-size: 0.9rem;
    line-height: 1.4;
  }
  .game-modes {
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
  }
  .game-modes span {
    padding: 4px 10px;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--neon-purple);
    background: rgba(176,107,255,0.1);
    border: 1px solid var(--panel-border);
    border-radius: 999px;
  }
  .game-play {
    margin-top: 22px;
    padding: 12px 36px;
    font-family: 'Baloo 2', sans-serif;
    font-size: 0.95rem;
    font-weight: 800;
    letter-spacing: 0.1em;
    color: var(--ink);
    background: linear-gradient(90deg, var(--neon-yellow, #e6b800), var(--neon-coral));
    border-radius: 999px;
    box-shadow: 0 6px 20px rgba(255,106,61,0.35);
    transition: box-shadow 0.2s ease, transform 0.2s ease;
  }
  .game-card:hover .game-play {
    transform: scale(1.05);
    box-shadow: 0 8px 28px rgba(255,106,61,0.6);
  }
  @media (prefers-reduced-motion: reduce) {
    .game-card, .game-screen::before, .game-emblem { animation: none; }
    .game-card::after { display: none; }
  }
  .site-logo-wrap {
    position: fixed;
    top: 16px;
    left: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 10;
  }
  .site-logo {
    height: 56px;
    width: auto;
    padding: 4px;
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(26,14,43,0.12);
  }
  .site-logo-name {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 1.1rem;
    letter-spacing: 0.04em;
    color: #000;
  }
  @media (max-width: 480px) {
    .site-logo-wrap { top: 10px; left: 10px; gap: 6px; }
    .site-logo { height: 40px; }
    .site-logo-name { font-size: 0.85rem; }
  }
</style>
</head>
<body>
<div class="site-logo-wrap">
  <img class="site-logo" src="/assets/kitty-games-logo.webp" alt="Kitty Games logo">
  <span class="site-logo-name">Kitty Games</span>
</div>
<div class="shell">
  <header>
    <div class="tagline">Arcade &middot; Strategy &middot; Beyond</div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" id="tab-btn-games">GAMES</button>
    <button class="tab-btn" id="tab-btn-memberships">MEMBERSHIPS</button>
  </div>

  <div class="tab-panel active" id="tab-games">
    <a class="game-card" href="/nexus/">
      <div class="game-screen" aria-hidden="true">
        <svg class="game-emblem" viewBox="0 0 100 100">
          <defs>
            <linearGradient id="hex-grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ffb347"/>
              <stop offset="0.5" stop-color="#ff6a3d"/>
              <stop offset="1" stop-color="#b06bff"/>
            </linearGradient>
          </defs>
          <polygon points="50,6 88,28 88,72 50,94 12,72 12,28" fill="rgba(26,14,43,0.6)" stroke="url(#hex-grad)" stroke-width="5" stroke-linejoin="round"/>
          <polygon points="50,26 70,38 70,62 50,74 30,62 30,38" fill="none" stroke="url(#hex-grad)" stroke-width="3" stroke-linejoin="round" opacity="0.8"/>
          <circle cx="50" cy="50" r="6" fill="#fff"/>
        </svg>
      </div>
      <div class="game-body">
        <div class="game-name">NEXUS GAMES</div>
        <div class="game-desc">Tower defense, real-time strategy, camera-tracked taekwondo, and an illustrated story mode — all in one arcade.</div>
        <div class="game-modes">
          <span>Tower Defense</span><span>RTS</span><span>Taekwondo</span><span>Story</span>
        </div>
        <span class="game-play">PLAY →</span>
      </div>
    </a>
  </div>

  <div class="tab-panel" id="tab-memberships">
    <div class="membership-empty">No memberships available right now.</div>
  </div>
</div>

<script>
  const tabs = {
    games: { btn: document.getElementById('tab-btn-games'), panel: document.getElementById('tab-games') },
    memberships: { btn: document.getElementById('tab-btn-memberships'), panel: document.getElementById('tab-memberships') },
  };
  Object.keys(tabs).forEach(function(key) {
    tabs[key].btn.onclick = function() {
      Object.keys(tabs).forEach(function(k) {
        tabs[k].btn.classList.toggle('active', k === key);
        tabs[k].panel.classList.toggle('active', k === key);
      });
    };
  });
</script>
</body>
</html>
