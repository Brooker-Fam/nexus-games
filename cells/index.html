<!DOCTYPE html>
<!-- Exploring Cells - Kitty Games educational game -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exploring Cells · Kitty Games</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script>
  if(location.protocol!=='file:'){
    const l=document.createElement('link');
    l.rel='stylesheet';
    l.href='https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap';
    document.head.appendChild(l);
  }
</script>
<style>
  :root {
    --ink: #2b1640;
    --sky: #bfeaff;
    --paper: #fffdf5;
    --pink: #ff8fb8;
    --yellow: #ffd23f;
    --green: #8be36b;
    --purple: #a77bff;
    --coral: #ff6a3d;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { min-height: 100%; }
  body {
    font-family: 'Baloo 2', 'Comic Sans MS', system-ui, sans-serif;
    color: var(--ink);
    background-color: var(--sky);
    background-image:
      radial-gradient(circle, rgba(255,255,255,0.7) 3px, transparent 4px),
      radial-gradient(circle, rgba(255,255,255,0.4) 2px, transparent 3px);
    background-size: 46px 46px, 46px 46px;
    background-position: 0 0, 23px 23px;
    overflow-x: hidden;
  }
  button { font-family: inherit; color: inherit; }

  /* ---------- cartoon buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 8px 18px;
    font-size: 1rem; font-weight: 800; letter-spacing: 0.02em;
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 16px;
    box-shadow: 0 5px 0 var(--ink);
    cursor: pointer;
    text-decoration: none;
    color: var(--ink);
    transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.15s ease;
    user-select: none;
  }
  .btn:hover { background: #fff7d6; }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
  .btn.primary { background: var(--yellow); }
  .btn.primary:hover { background: #ffe066; }
  .btn:focus-visible { outline: 4px solid var(--coral); outline-offset: 3px; }

  /* ---------- top bar ---------- */
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    max-width: 1180px; margin: 0 auto;
    padding: 14px 16px 0;
  }
  .topbar .btn { padding: 6px 14px; font-size: 0.9rem; }
  .icon-btn { width: 46px; padding: 6px !important; }
  .icon-btn svg { width: 24px; height: 24px; }

  .screen { display: none; }
  .screen.active { display: block; }

  /* ---------- title screen ---------- */
  .title-wrap {
    max-width: 920px; margin: 0 auto;
    padding: 16px 16px 48px;
    text-align: center;
  }
  .title-mascot { width: 150px; height: 150px; margin: 4px auto 0; display: block; animation: mascot-bounce 2.4s ease-in-out infinite; }
  @keyframes mascot-bounce {
    0%,100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-10px) rotate(3deg); }
  }
  .big-title {
    font-size: clamp(2.4rem, 8vw, 4.4rem);
    font-weight: 800;
    line-height: 1;
    color: #fff;
    -webkit-text-stroke: 8px var(--ink);
    paint-order: stroke fill;
    text-shadow: 0 7px 0 var(--ink);
    letter-spacing: 0.02em;
  }
  .big-title .t1 { color: var(--yellow); }
  .big-title .t2 { color: var(--pink); }
  .intro-bubble {
    position: relative;
    display: inline-block;
    max-width: 560px;
    margin: 26px auto 0;
    padding: 14px 22px;
    font-size: 1.1rem; font-weight: 600; line-height: 1.35;
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 22px;
    box-shadow: 0 5px 0 var(--ink);
  }
  .intro-bubble::before {
    content: ''; position: absolute; left: 50%; top: -15px;
    width: 24px; height: 24px; margin-left: -12px;
    background: #fff;
    border-left: 3px solid var(--ink); border-top: 3px solid var(--ink);
    transform: rotate(45deg);
  }
  .pick-row {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px;
    margin-top: 32px;
  }
  .pick-card {
    display: flex; flex-direction: column; align-items: center;
    padding: 14px 14px 18px;
    background: var(--paper);
    border: 4px solid var(--ink);
    border-radius: 28px;
    box-shadow: 0 8px 0 var(--ink);
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .pick-card:hover { transform: translateY(-5px) rotate(-1deg); box-shadow: 0 13px 0 var(--ink); }
  .pick-card:nth-child(2):hover { transform: translateY(-5px) rotate(1deg); }
  .pick-card:active { transform: translateY(4px); box-shadow: 0 4px 0 var(--ink); }
  .pick-card:focus-visible { outline: 4px solid var(--coral); outline-offset: 4px; }
  .pick-card svg { width: 100%; height: auto; pointer-events: none; }
  .pick-name { margin-top: 6px; font-size: 1.6rem; font-weight: 800; }
  .pick-sub { font-size: 0.95rem; font-weight: 600; opacity: 0.7; }
  .pick-progress { margin-top: 8px; font-size: 0.85rem; font-weight: 800; padding: 2px 12px; border-radius: 999px; background: #fff; border: 2px solid var(--ink); }

  /* ---------- game screen ---------- */
  .game-wrap { max-width: 1180px; margin: 0 auto; padding: 14px 16px 40px; }
  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px;
    margin-bottom: 16px;
  }
  .seg {
    display: inline-flex;
    border: 3px solid var(--ink);
    border-radius: 16px;
    background: #fff;
    box-shadow: 0 5px 0 var(--ink);
    overflow: hidden;
  }
  .seg button {
    padding: 7px 16px;
    font-size: 1rem; font-weight: 800;
    background: transparent;
    border: none;
    cursor: pointer;
  }
  .seg button + button { border-left: 3px solid var(--ink); }
  .seg button.on { background: var(--yellow); }
  .seg button:hover:not(.on) { background: #fff7d6; }
  .seg button:focus-visible { outline: 3px solid var(--coral); outline-offset: -5px; }
  .btn.toggle.on { background: var(--green); }

  .game-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
    gap: 22px;
    align-items: start;
  }
  .stage {
    position: relative;
    background-color: var(--paper);
    background-image: radial-gradient(circle, rgba(43,22,64,0.08) 2px, transparent 2.5px);
    background-size: 24px 24px;
    border: 4px solid var(--ink);
    border-radius: 30px;
    box-shadow: 0 9px 0 var(--ink);
    padding: 10px;
  }
  .quiz-banner {
    display: none;
    margin: 4px 4px 8px;
    padding: 10px 16px;
    font-size: 1.15rem; font-weight: 800; line-height: 1.25;
    text-align: center;
    background: var(--yellow);
    border: 3px solid var(--ink);
    border-radius: 18px;
  }
  .quiz-banner small { display: block; font-size: 0.8rem; opacity: 0.7; letter-spacing: 0.06em; text-transform: uppercase; }
  .stage.quiz .quiz-banner { display: block; }
  .quiz-banner .fb { display: block; font-size: 0.9rem; min-height: 0; }
  .quiz-banner .fb:empty { display: none; }
  .quiz-banner .fb.good { color: #1f7a1f; }
  .quiz-banner .fb.bad { color: #b3261e; }
  #cell { display: block; width: 100%; height: auto; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

  /* parts */
  .part { cursor: pointer; }
  .part:hover > .pos { filter: brightness(1.07); }
  .bob { animation: bob 3.2s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .fx { transform-box: fill-box; transform-origin: center; }
  .eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
  .part.selected > .pos, .part.correct > .pos {
    animation: glow 0.9s ease-in-out infinite alternate;
  }
  @keyframes glow {
    from { filter: drop-shadow(0 0 2px #fff36b) drop-shadow(0 0 4px #ffb800); }
    to   { filter: drop-shadow(0 0 7px #fff36b) drop-shadow(0 0 12px #ffb800); }
  }
  .part.correct > .pos { animation-name: glow-green; }
  @keyframes glow-green {
    from { filter: drop-shadow(0 0 3px #b6ff7a) drop-shadow(0 0 6px #3ccf3c); }
    to   { filter: drop-shadow(0 0 9px #b6ff7a) drop-shadow(0 0 14px #3ccf3c); }
  }
  .part.hint > .pos { animation: glow 0.45s ease-in-out infinite alternate; }
  .part.wrong .fx { animation: shake 0.45s ease; }
  @keyframes shake {
    0%,100% { transform: translateX(0) rotate(0); }
    20% { transform: translateX(-6px) rotate(-4deg); }
    40% { transform: translateX(6px) rotate(4deg); }
    60% { transform: translateX(-4px) rotate(-2deg); }
    80% { transform: translateX(4px) rotate(2deg); }
  }
  .part.selected .fx, .part.correct .fx { animation: boing 0.5s ease; }
  @keyframes boing {
    0% { transform: scale(1); } 30% { transform: scale(1.12, 0.9); } 55% { transform: scale(0.95, 1.06); } 100% { transform: scale(1); }
  }
  .part.big.selected .fx, .part.big.correct .fx { animation: none; }
  .floaty { animation: drift 7s ease-in-out infinite; }
  @keyframes drift { 0%,100% { transform: translate(0,0); } 33% { transform: translate(6px,-5px); } 66% { transform: translate(-5px,4px); } }
  #labels { display: none; }
  #cell.show-labels #labels { display: inline; }
  #labels text { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 15px; fill: var(--ink); }

  /* side panel */
  .side { display: flex; flex-direction: column; gap: 18px; }
  .guide { display: flex; flex-direction: column; }
  .guide-head { display: flex; align-items: flex-end; gap: 8px; margin-left: 6px; }
  .guide-head svg { width: 76px; height: 76px; flex: none; }
  .guide-name { font-weight: 800; font-size: 1.05rem; margin-bottom: 14px; }
  .bubble {
    position: relative;
    margin-top: 10px;
    padding: 16px 18px;
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 22px;
    box-shadow: 0 6px 0 var(--ink);
    font-size: 1rem; font-weight: 600; line-height: 1.4;
    min-height: 120px;
  }
  .bubble::before {
    content: ''; position: absolute; left: 34px; top: -14px;
    width: 22px; height: 22px;
    background: #fff;
    border-left: 3px solid var(--ink); border-top: 3px solid var(--ink);
    transform: rotate(45deg);
  }
  .bubble.pop { animation: bubble-pop 0.3s ease; }
  @keyframes bubble-pop { 0% { transform: scale(0.94); } 60% { transform: scale(1.03); } 100% { transform: scale(1); } }
  .part-title {
    display: flex; align-items: center; gap: 10px;
    font-size: 1.45rem; font-weight: 800; line-height: 1.1;
    margin-bottom: 4px;
  }
  .swatch { width: 22px; height: 22px; flex: none; border-radius: 50%; border: 3px solid var(--ink); }
  .new-badge {
    font-size: 0.7rem; font-weight: 800; letter-spacing: 0.08em;
    padding: 1px 8px; border-radius: 999px;
    background: var(--coral); color: #fff; border: 2px solid var(--ink);
  }
  .fullname { font-size: 0.85rem; opacity: 0.65; margin-bottom: 6px; }
  .info-row { margin-top: 10px; padding: 8px 12px; border-radius: 14px; background: #f3f0ff; }
  .info-row b { display: block; font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; }
  .info-row.like { background: #e5f8ff; }
  .info-row.fact { background: #fff4cc; }
  .bubble .btn { margin-top: 12px; }
  .bubble p + p { margin-top: 8px; }

  .progress-card {
    padding: 14px 16px 16px;
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 22px;
    box-shadow: 0 6px 0 var(--ink);
  }
  .progress-head { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 1.05rem; }
  .meter { margin-top: 8px; height: 16px; border: 3px solid var(--ink); border-radius: 999px; background: #fff; overflow: hidden; }
  .meter > div { height: 100%; width: 0; background: repeating-linear-gradient(45deg, #6fdc5a 0 10px, #8be36b 10px 20px); transition: width 0.4s ease; }
  .stickers { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .sticker {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px 3px 4px;
    font-size: 0.85rem; font-weight: 800;
    background: #fff;
    border: 2px solid var(--ink);
    border-radius: 999px;
    cursor: pointer;
  }
  .sticker .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--ink); background: #ddd; }
  .sticker.locked { opacity: 0.55; }
  .sticker.locked .dot { background: repeating-linear-gradient(45deg, #ccc 0 3px, #eee 3px 6px); }
  .sticker.current { background: #fff36b; }
  .sticker:focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; }
  .star-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
  .star-row svg { width: 30px; height: 30px; }
  .big-stars { display: flex; justify-content: center; flex-wrap: wrap; gap: 2px; margin: 8px 0; }
  .big-stars svg { width: 34px; height: 34px; }

  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

  @media (max-width: 900px) {
    .game-grid { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 560px) {
    .pick-row { grid-template-columns: minmax(0, 1fr); gap: 18px; }
    .seg button { padding: 6px 11px; font-size: 0.9rem; }
    .btn { padding: 6px 12px; font-size: 0.9rem; }
    .stage { padding: 6px; border-radius: 22px; }
    .quiz-banner { font-size: 1rem; }
    .topbar .crumb { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .bob, .eyes, .floaty, .title-mascot, .part .fx { animation: none !important; }
  }
</style>
</head>
<body>
<header class="topbar">
  <a class="btn" href="/">&larr; <span class="crumb">Kitty Games</span></a>
  <button class="btn icon-btn" id="sound-btn" aria-label="Turn sound off" title="Sound"></button>
</header>

<!-- ============ TITLE SCREEN ============ -->
<section class="screen active" id="screen-title">
  <div class="title-wrap">
    <svg class="title-mascot" id="title-mascot" viewBox="0 0 120 120" aria-hidden="true"></svg>
    <h1 class="big-title"><span class="t1">Exploring</span> <span class="t2">Cells</span></h1>
    <div class="intro-bubble">Hi, I'm <b>Professor Goo</b>! Every living thing is made of tiny cells. Pick a cell and let's peek inside!</div>
    <div class="pick-row">
      <button class="pick-card" data-pick="animal">
        <svg viewBox="0 0 800 600" id="preview-animal" aria-hidden="true"></svg>
        <span class="pick-name">Animal Cell</span>
        <span class="pick-sub">Like the cells in you and your cat!</span>
        <span class="pick-progress" id="pp-animal"></span>
      </button>
      <button class="pick-card" data-pick="plant">
        <svg viewBox="0 0 800 600" id="preview-plant" aria-hidden="true"></svg>
        <span class="pick-name">Plant Cell</span>
        <span class="pick-sub">Like the cells in leaves and flowers!</span>
        <span class="pick-progress" id="pp-plant"></span>
      </button>
    </div>
  </div>
</section>

<!-- ============ GAME SCREEN ============ -->
<section class="screen" id="screen-game">
  <div class="game-wrap">
    <div class="toolbar">
      <div class="seg" role="group" aria-label="Cell type">
        <button data-cell="animal">Animal</button><button data-cell="plant">Plant</button>
      </div>
      <div class="seg" role="group" aria-label="Mode">
        <button data-mode="explore">Explore</button><button data-mode="quiz">Quiz</button>
      </div>
      <button class="btn toggle" id="labels-btn">Labels</button>
    </div>
    <div class="game-grid">
      <div class="stage" id="stage">
        <div class="quiz-banner" id="quiz-banner"></div>
        <svg id="cell" viewBox="0 0 800 600" role="img" aria-label="Cartoon cell. Tap a part to learn about it."></svg>
      </div>
      <aside class="side">
        <div class="guide">
          <div class="guide-head">
            <svg id="side-mascot" viewBox="0 0 120 120" aria-hidden="true"></svg>
            <div class="guide-name">Professor Goo says…</div>
          </div>
          <div class="bubble" id="bubble" aria-live="polite"></div>
        </div>
        <div class="progress-card" id="progress"></div>
      </aside>
    </div>
  </div>
</section>

<canvas id="confetti"></canvas>

<script>
(function(){
  'use strict';

  // ================= colors =================
  const INK = '#2b1640';
  const C = {
    membraneA: '#ff8fb8', cytoA: '#ffe9f2', cytoAdot: '#ff9fc4',
    nucleus: '#a77bff', nucleusRing: '#c9adff', chromatin: '#8455ee', nucleolus: '#6b3fd1',
    mito: '#ff9f43', mitoIn: '#ffd9ab', cristae: '#e8731c',
    ribo: '#3d2c8d',
    rough: '#6cb8ff', smooth: '#3fd0b0', golgi: '#ffd23f',
    lyso: '#ff6b6b', lysoDot: '#c93c4f',
    vac: '#9be7ff', centro: '#b8e04a', centroLine: '#6f9a12',
    wall: '#9bd56f', wallDark: '#5e9c3f',
    cytoP: '#effce0', cytoPdot: '#a5d98a', membraneP: '#ffcd4d',
    chloro: '#49c25a', chloroIn: '#8fe07f', grana: '#23863a',
    cvac: '#a9e4ff', cvacWave: '#62c3ee',
  };

  // ================= the parts =================
  const PARTS = {
    membrane: {
      name: 'Cell Membrane', color: C.membraneA,
      job: 'A thin, bendy skin around the cell. It decides what gets in (like food and water) and what goes out (like waste).',
      like: 'A security guard at the door, checking who comes in and out.',
      fact: 'It’s made of fatty molecules lined up in two rows, tail-to-tail, like a double row of tiny lollipops!',
      clues: ['Tap the part that controls what goes in and out of the cell!', 'Find the thin, bendy skin that wraps around the cell!'],
    },
    cytoplasm: {
      name: 'Cytoplasm', color: '#ffc2da',
      job: 'The squishy jelly that fills the cell. All the other parts float in it, and lots of the cell’s chemistry happens here.',
      like: 'The streets and parks of a city, where everyone gets around.',
      fact: 'Cytoplasm is mostly water, which is why cells are so squishy!',
      clues: ['Tap the jelly that all the cell parts float in!', 'Find the squishy, watery stuff that fills the cell!'],
    },
    nucleus: {
      name: 'Nucleus', color: C.nucleus,
      job: 'The control center! It holds the DNA, the instruction book that tells the cell how to grow, work and make copies of itself.',
      like: 'The mayor’s office, or the cell’s brain.',
      fact: 'If you stretched out all the DNA from just one of your cells, it would be about 2 meters long, taller than a grown-up!',
      clues: ['Tap the control center that holds the DNA!', 'Where does the cell keep its instruction book?'],
    },
    mitochondria: {
      name: 'Mitochondria', color: C.mito,
      job: 'The powerhouses! They turn food (sugar) and oxygen into energy the cell can use.',
      like: 'A power plant that keeps all the lights on.',
      fact: 'Mitochondria have their own tiny bit of DNA, and you got all of yours from your mom!',
      clues: ['Tap the powerhouse that makes energy for the cell!', 'Which part turns food into energy?'],
    },
    ribosome: {
      name: 'Ribosomes', color: C.ribo,
      job: 'Tiny builders that read instructions from the DNA and use them to put together proteins.',
      like: 'Workers in a factory, snapping parts together.',
      fact: 'One cell can have millions of ribosomes! They’re the little dots floating around.',
      clues: ['Tap one of the tiny floating dots that build proteins!', 'Find a little protein builder floating in the jelly!'],
    },
    roughER: {
      name: 'Rough ER', full: 'Rough Endoplasmic Reticulum', color: C.rough,
      job: 'Folded tubes covered in ribosomes. Proteins get built here and then sent off to be packed up.',
      like: 'A factory assembly line.',
      fact: 'It looks bumpy, or “rough”, because ribosomes are stuck all over it!',
      clues: ['Tap the bumpy tubes covered in ribosomes!', 'Find the folded tubes with dots all over them, wrapped near the nucleus!'],
    },
    smoothER: {
      name: 'Smooth ER', full: 'Smooth Endoplasmic Reticulum', color: C.smooth,
      job: 'Wiggly tubes with no ribosomes. They make fats and help clean harmful stuff out of the cell.',
      like: 'A workshop that makes oils and cleaning supplies.',
      fact: 'Your liver cells are packed with smooth ER to help break down things that could hurt you.',
      clues: ['Tap the smooth, wiggly tubes that make fats!', 'Find the tubes that have NO bumps on them!'],
    },
    golgi: {
      name: 'Golgi Apparatus', color: C.golgi,
      job: 'Packs proteins into little bubbles called vesicles and ships them to where they need to go.',
      like: 'The post office of the cell.',
      fact: 'It’s named after Camillo Golgi, an Italian scientist who discovered it in 1898.',
      clues: ['Tap the cell’s post office that packs and ships proteins!', 'Find the stack of curvy pancakes that wraps up packages!'],
    },
    lysosome: {
      name: 'Lysosomes', color: C.lyso,
      job: 'Little bubbles full of digestive juices. They break down waste and worn-out cell parts.',
      like: 'The recycling and clean-up crew.',
      fact: 'Lysosomes are acidic inside, which helps their special enzymes chop things into tiny pieces.',
      clues: ['Tap the clean-up crew that breaks down waste!', 'Which little bubble recycles old cell parts?'],
    },
    vacuole: {
      name: 'Vacuole', color: C.vac,
      job: 'A small storage bubble that holds water, food or waste until the cell needs it.',
      like: 'A storage closet.',
      fact: 'Animal cells have small vacuoles, but plant cells have one GIANT one!',
      clues: ['Tap the small storage bubble!', 'Where does an animal cell keep extra water and food?'],
    },
    centrosome: {
      name: 'Centrosome', color: C.centro,
      job: 'Helps the cell split in two by organizing fibers that pull the copied DNA apart.',
      like: 'A coach directing the team during a big play.',
      fact: 'It has two tiny tube bundles called centrioles that sit at right angles to each other.',
      clues: ['Tap the part that helps the cell split in two!', 'Find the two little striped tubes sitting at right angles!'],
    },
    wall: {
      name: 'Cell Wall', color: C.wall,
      job: 'A tough, stiff layer outside the membrane. It protects the plant cell and keeps its boxy shape.',

    const n = pts.length;

    let d = 'M' + fmt(pts[0]);

      const p0 = get(i - 1), p1 = get(i), p2 = get(i + 1), p3 = get(i + 2);

      cx2.fillStyle = b.c; cx2.strokeStyle = INK; cx2.lineWidth = 2;
      cx2.beginPath();
      if (b.round) cx2.arc(0, 0, b.r * 0.6, 0, Math.PI * 2); else cx2.rect(-b.r / 2, -b.r / 3, b.r, b.r * 0.66);
      cx2.fill(); cx2.stroke(); cx2.restore();
    });
    bits = bits.filter(b => b.y < cv.height + 30);
    if (bits.length) requestAnimationFrame(tick);
    else { confettiRunning = false; cx2.clearRect(0, 0, cv.width, cv.height); }
  }

  // ================= state =================
  const QUIZ_LEN = 8;
  const state = {
    cell: 'animal', mode: 'explore', selected: null, labels: false, sound: true,
    found: { animal: new Set(), plant: new Set() },
    quiz: null,
  };
  try {
    const saved = JSON.parse(localStorage.getItem('kg-cells') || '{}');
    if (saved.found) {
      ['animal', 'plant'].forEach(k => (saved.found[k] || []).forEach(id => { if (CELLS[k].parts.includes(id)) state.found[k].add(id); }));
    }
    if (saved.sound === false) state.sound = false;
  } catch (e) { /* storage unavailable */ }
  function save() {
    try {
      localStorage.setItem('kg-cells', JSON.stringify({
        found: { animal: [...state.found.animal], plant: [...state.found.plant] },
        sound: state.sound,
      }));
    } catch (e) { /* storage unavailable */ }
  }

  // ================= DOM =================
  const $ = id => document.getElementById(id);
  const svg = $('cell'), bubble = $('bubble'), progress = $('progress'), banner = $('quiz-banner'), stage = $('stage');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const pick = a => a[Math.floor(Math.random() * a.length)];

  $('title-mascot').innerHTML = mascot();
  $('side-mascot').innerHTML = mascot();

  function renderSoundBtn() {
    const b = $('sound-btn');
    b.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="${INK}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="#ffd23f"/>${state.sound ? '<path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>' : '<path d="M17 9l5 6M22 9l-5 6"/>'}</svg>`;
    b.setAttribute('aria-label', state.sound ? 'Turn sound off' : 'Turn sound on');
  }
  $('sound-btn').onclick = () => { state.sound = !state.sound; save(); renderSoundBtn(); sfx.pop(); };
  renderSoundBtn();

  function renderTitle() {
    $('preview-animal').innerHTML = CELLS.animal.build();
    $('preview-plant').innerHTML = CELLS.plant.build();
    ['animal', 'plant'].forEach(k => {
      const n = state.found[k].size, t = CELLS[k].parts.length;
      $('pp-' + k).textContent = n === t ? '★ All ' + t + ' parts found!' : n + ' / ' + t + ' parts found';
    });
  }
  function showScreen(name) {
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === 'screen-' + name));
    window.scrollTo(0, 0);
  }
  document.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { sfx.pop(); startGame(b.dataset.pick); });

  // ================= game =================
  function startGame(cell) {
    state.cell = cell;
    state.mode = 'explore';
    state.selected = null;
    state.quiz = null;
    showScreen('game');
    renderAll();
    exploreWelcome();
  }
  function renderAll() {
    document.querySelectorAll('[data-cell]').forEach(b => b.classList.toggle('on', b.dataset.cell === state.cell));
    document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === state.mode));
    $('labels-btn').classList.toggle('on', state.labels);
    $('labels-btn').style.display = state.mode === 'explore' ? '' : 'none';
    stage.classList.toggle('quiz', state.mode === 'quiz');
    svg.innerHTML = CELLS[state.cell].build() + labelsMarkup(state.cell);
    svg.classList.toggle('show-labels', state.labels && state.mode === 'explore');
    applyClasses();
    renderProgress();
  }
  function forParts(id, fn) { svg.querySelectorAll('.part[data-part="' + id + '"]').forEach(fn); }
  function applyClasses() {
    svg.querySelectorAll('.part').forEach(g => {
      g.classList.toggle('selected', state.mode === 'explore' && g.dataset.part === state.selected);
    });
  }
  function setBubble(html) {
    bubble.innerHTML = html;
    bubble.classList.remove('pop'); void bubble.offsetWidth; bubble.classList.add('pop');
  }

  function exploreWelcome() {
    const c = CELLS[state.cell];
    const left = c.parts.length - state.found[state.cell].size;
    setBubble(`<p>Welcome to the <b>${c.name}</b>! Tap any part of the cell to find out what it does.</p>` +
      (left ? `<p>Can you discover all <b>${c.parts.length}</b> parts?</p>` : `<p>You've already found every part. Try the <b>Quiz</b> to test yourself!</p>`) +
      `<p style="opacity:.7;font-size:.9rem">Tip: the <b>Labels</b> button shows every part's name.</p>`);
  }

  function showInfo(id, isNew) {
    const p = PARTS[id];
    let extra = '';
    if (state.cell === 'plant' && id === 'membrane') extra = ' In plants it sits just inside the cell wall.';
    setBubble(`<div class="part-title"><span class="swatch" style="background:${p.color}"></span>${esc(p.name)}${isNew ? ' <span class="new-badge">NEW!</span>' : ''}</div>` +
      (p.full ? `<div class="fullname">${esc(p.full)}</div>` : '') +
      `<div class="info-row"><b>What it does</b>${esc(p.job + extra)}</div>` +
      `<div class="info-row like"><b>It’s like…</b>${esc(p.like)}</div>` +
      `<div class="info-row fact"><b>Fun fact!</b>${esc(p.fact)}</div>`);
  }

  function renderProgress() {
    const c = CELLS[state.cell];
    if (state.mode === 'explore') {
      const f = state.found[state.cell];
      progress.innerHTML = `<div class="progress-head"><span>Parts discovered</span><span>${f.size} / ${c.parts.length}</span></div>` +
        `<div class="meter"><div style="width:${(f.size / c.parts.length * 100).toFixed(1)}%"></div></div>` +
        `<div class="stickers">` + c.parts.map(id => {
          const ok = f.has(id), p = PARTS[id];
          return `<button class="sticker${ok ? '' : ' locked'}${state.selected === id ? ' current' : ''}" data-sticker="${id}" aria-label="${ok ? esc(p.name) : 'Undiscovered part'}">` +
            `<span class="dot" style="${ok ? 'background:' + p.color : ''}"></span>${ok ? esc(p.name) : '???'}</button>`;
        }).join('') + `</div>`;
      progress.querySelectorAll('[data-sticker]').forEach(b => b.onclick = () => {
        const id = b.dataset.sticker;
        if (state.found[state.cell].has(id)) exploreTap(id);
        else { sfx.wrong(); setBubble(`<p>That part is still a mystery! Tap around the cell to discover it.</p>`); }
      });
    } else {
      const q = state.quiz;
      const results = q ? q.results : [];
      progress.innerHTML = `<div class="progress-head"><span>Quiz stars</span><span>${q ? q.stars : 0} / ${QUIZ_LEN}</span></div>` +
        `<div class="star-row">` + Array.from({ length: QUIZ_LEN }, (_, i) => star(results[i] === true)).join('') + `</div>` +
        `<p style="margin-top:10px;font-weight:600;font-size:.9rem;opacity:.75">Get it right on the first try to earn a star!</p>`;
    }
  }

  function exploreTap(id) {
    const f = state.found[state.cell];
    const isNew = !f.has(id);
    state.selected = id;
    f.add(id);
    save();
    applyClasses();
    showInfo(id, isNew);
    renderProgress();
    if (isNew) sfx.newFind(); else sfx.pop();
    if (isNew && f.size === CELLS[state.cell].parts.length) {
      setTimeout(() => {
        sfx.fanfare(); confetti();
        bubble.insertAdjacentHTML('beforeend', `<div class="info-row" style="background:#e3ffd6"><b>You did it!</b>You discovered every part of the ${CELLS[state.cell].name}! Ready to test yourself?</div><button class="btn primary" data-go="quiz">Take the Quiz →</button>`);
        bubble.querySelector('[data-go="quiz"]').onclick = () => setMode('quiz');
      }, 500);
    }
  }

  // ---------- quiz ----------
  function startQuiz() {
    const ids = shuffle(CELLS[state.cell].parts.slice()).slice(0, QUIZ_LEN);
    state.quiz = { ids, i: 0, stars: 0, misses: 0, results: [], locked: false };
    renderProgress();
    nextQuestion();
  }
  function clearQuizMarks() {
    svg.querySelectorAll('.part').forEach(g => g.classList.remove('correct', 'hint', 'wrong'));
  }
  function nextQuestion() {
    const q = state.quiz;
    clearQuizMarks();
    if (q.i >= q.ids.length) return endQuiz();
    const id = q.ids[q.i];
    q.misses = 0;
    banner.innerHTML = `<small>Question ${q.i + 1} of ${q.ids.length}</small>${esc(pick(PARTS[id].clues))}<span class="fb" id="quiz-fb"></span>`;
    setBubble(`<p>Read the clue at the top, then tap the matching part of the cell!</p><p style="opacity:.7;font-size:.9rem">Stuck? After two tries I'll give you a hint.</p>`);
  }
  function quizTap(id) {
    const q = state.quiz;
    if (!q || q.locked || q.i >= q.ids.length) return;
    const target = q.ids[q.i];
    if (id === target) {
      q.locked = true;
      const first = q.misses === 0;
      q.results[q.i] = first;
      if (first) q.stars++;
      svg.querySelectorAll('.part.hint').forEach(g => g.classList.remove('hint'));
      forParts(id, g => g.classList.add('correct'));
      sfx.right();
      renderProgress();
      setFeedback((first ? 'Yes! ' : 'Got it! ') + 'That\u2019s the ' + PARTS[id].name + '!', 'good');
      setBubble(`<div class="part-title"><span class="swatch" style="background:${PARTS[id].color}"></span>${first ? 'Yes! ' : 'Got it! '}${esc(PARTS[id].name)}</div><p>${esc(PARTS[id].job)}</p>`);
      setTimeout(() => { q.i++; q.locked = false; nextQuestion(); }, 2100);
    } else {
      q.misses++;
      forParts(id, g => { g.classList.remove('wrong'); void g.getBBox(); g.classList.add('wrong'); setTimeout(() => g.classList.remove('wrong'), 500); });
      sfx.wrong();
      let msg = `<p>Oops! That's the <b>${esc(PARTS[id].name)}</b>. ${esc(PARTS[id].job.split('. ')[0].replace(/\.$/, ''))}.</p>`;
      if (q.misses >= 2) {
        forParts(target, g => g.classList.add('hint'));
        msg += `<p><b>Hint:</b> look for the part that's glowing!</p>`;
      } else msg += `<p>Try again!</p>`;
      setFeedback('Oops! That\u2019s the ' + PARTS[id].name + '. ' + (q.misses >= 2 ? 'Look for the glowing part!' : 'Try again!'), 'bad');
      setBubble(msg);
    }
  }
  function setFeedback(text, kind) {
    const el = $('quiz-fb');
    if (!el) return;
    el.textContent = text;
    el.className = 'fb ' + kind;
  }
  function endQuiz() {
    const q = state.quiz;
    banner.innerHTML = `<small>All done!</small>Quiz complete!`;
    const s = q.stars;
    const msg = s === QUIZ_LEN ? 'PERFECT! You’re a real cell scientist!' : s >= 6 ? 'Amazing work! You really know your cell parts!' : s >= 3 ? 'Nice job! Explore a bit more and try again!' : 'Good try! Explore the cell, then come back for more stars!';
    setBubble(`<div class="part-title">You earned ${s} star${s === 1 ? '' : 's'}!</div>` +
      `<div class="big-stars">${q.results.map(r => star(r)).join('')}</div><p>${msg}</p>` +
      `<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" data-go="again">Play again</button><button class="btn" data-go="explore">Explore</button>` +
      `<button class="btn" data-go="other">Try the ${state.cell === 'animal' ? 'Plant' : 'Animal'} Cell</button></div>`);
    bubble.querySelector('[data-go="again"]').onclick = () => { sfx.pop(); startQuiz(); };
    bubble.querySelector('[data-go="explore"]').onclick = () => setMode('explore');
    bubble.querySelector('[data-go="other"]').onclick = () => { sfx.pop(); setCell(state.cell === 'animal' ? 'plant' : 'animal'); };
    if (s >= 6) { sfx.fanfare(); confetti(); }
  }

  // ---------- switching ----------
  function setMode(mode) {
    sfx.pop();
    state.mode = mode;
    state.selected = null;
    renderAll();
    if (mode === 'quiz') startQuiz(); else { state.quiz = null; exploreWelcome(); }
  }
  function setCell(cell) {
    state.cell = cell;
    state.selected = null;
    renderAll();
    if (state.mode === 'quiz') startQuiz(); else exploreWelcome();
  }
  document.querySelectorAll('[data-cell]').forEach(b => b.onclick = () => { if (b.dataset.cell !== state.cell) { sfx.pop(); setCell(b.dataset.cell); } });
  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { if (b.dataset.mode !== state.mode) setMode(b.dataset.mode); });
  $('labels-btn').onclick = () => {
    sfx.pop();
    state.labels = !state.labels;
    $('labels-btn').classList.toggle('on', state.labels);
    svg.classList.toggle('show-labels', state.labels);
  };
  svg.addEventListener('click', e => {
    const p = e.target.closest('.part');
    if (!p) return;
    if (state.mode === 'explore') exploreTap(p.dataset.part); else quizTap(p.dataset.part);
  });

  renderTitle();
  // allow deep links like /cells/#plant
  const h = location.hash.replace('#', '');
  if (h === 'animal' || h === 'plant') startGame(h);
})();
</script>
</body>
</html>
