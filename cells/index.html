<!DOCTYPE html>
<!-- Exploring Cells - Kitty Games educational game -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exploring Cells · Kitty Games</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script>
  if(location.protocol!=='file:'){
    const l=document.createElement('link');
    l.rel='stylesheet';
    l.href='https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap';
    document.head.appendChild(l);
  }
</script>
<style>
  :root {
    --ink: #2b1640;
    --sky: #bfeaff;
    --paper: #fffdf5;
    --pink: #ff8fb8;
    --yellow: #ffd23f;
    --green: #8be36b;
    --purple: #a77bff;
    --coral: #ff6a3d;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { min-height: 100%; }
  body {
    font-family: 'Baloo 2', 'Comic Sans MS', system-ui, sans-serif;
    color: var(--ink);
    background-color: var(--sky);
    background-image:
      radial-gradient(circle, rgba(255,255,255,0.7) 3px, transparent 4px),
      radial-gradient(circle, rgba(255,255,255,0.4) 2px, transparent 3px);
    background-size: 46px 46px, 46px 46px;
    background-position: 0 0, 23px 23px;
    overflow-x: hidden;
  }
  button { font-family: inherit; color: inherit; }

  /* ---------- cartoon buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 8px 18px;
    font-size: 1rem; font-weight: 800; letter-spacing: 0.02em;
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 16px;
    box-shadow: 0 5px 0 var(--ink);
    cursor: pointer;
    text-decoration: none;
    color: var(--ink);
    transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.15s ease;
    user-select: none;
  }
  .btn:hover { background: #fff7d6; }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
  .btn.primary { background: var(--yellow); }
  .btn.primary:hover { background: #ffe066; }
  .btn:focus-visible { outline: 4px solid var(--coral); outline-offset: 3px; }

  /* ---------- top bar ---------- */
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    max-width: 1180px; margin: 0 auto;
    padding: 14px 16px 0;
  }
  .topbar .btn { padding: 6px 14px; font-size: 0.9rem; }
  .icon-btn { width: 46px; padding: 6px !important; }
  .icon-btn svg { width: 24px; height: 24px; }

  .screen { display: none; }
  .screen.active { display: block; }

  /* ---------- title screen ---------- */
  .title-wrap {
    max-width: 920px; margin: 0 auto;
    padding: 16px 16px 48px;
    text-align: center;
  }
  .title-mascot { width: 150px; height: 150px; margin: 4px auto 0; display: block; animation: mascot-bounce 2.4s ease-in-out infinite; }
  @keyframes mascot-bounce {
    0%,100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-10px) rotate(3deg); }
  }
  .big-title {
    font-size: clamp(2.4rem, 8vw, 4.4rem);
    font-weight: 800;
    line-height: 1;
    color: #fff;
    -webkit-text-stroke: 8px var(--ink);
    paint-order: stroke fill;
    text-shadow: 0 7px 0 var(--ink);
    letter-spacing: 0.02em;
  }
  .big-title .t1 { color: var(--yellow); }
  .big-title .t2 { color: var(--pink); }
  .intro-bubble {
    position: relative;
    display: inline-block;
    max-width: 560px;
    margin: 26px auto 0;
    padding: 14px 22px;
    font-size: 1.1rem; font-weight: 600; line-height: 1.35;
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 22px;
    box-shadow: 0 5px 0 var(--ink);
  }
  .intro-bubble::before {
    content: ''; position: absolute; left: 50%; top: -15px;
    width: 24px; height: 24px; margin-left: -12px;
    background: #fff;
    border-left: 3px solid var(--ink); border-top: 3px solid var(--ink);
    transform: rotate(45deg);
  }
  .pick-row {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px;
    margin-top: 32px;
  }
  .pick-card {
    display: flex; flex-direction: column; align-items: center;
    padding: 14px 14px 18px;
    background: var(--paper);
    border: 4px solid var(--ink);
    border-radius: 28px;
    box-shadow: 0 8px 0 var(--ink);
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .pick-card:hover { transform: translateY(-5px) rotate(-1deg); box-shadow: 0 13px 0 var(--ink); }
  .pick-card:nth-child(2):hover { transform: translateY(-5px) rotate(1deg); }
  .pick-card:active { transform: translateY(4px); box-shadow: 0 4px 0 var(--ink); }
  .pick-card:focus-visible { outline: 4px solid var(--coral); outline-offset: 4px; }
  .pick-card svg { width: 100%; height: auto; pointer-events: none; }
  .pick-name { margin-top: 6px; font-size: 1.6rem; font-weight: 800; }
  .pick-sub { font-size: 0.95rem; font-weight: 600; opacity: 0.7; }
  [hidden] { display: none !important; }
  .pick-progress { margin-top: 8px; font-size: 0.85rem; font-weight: 800; padding: 2px 12px; border-radius: 999px; background: #fff; border: 2px solid var(--ink); }

  /* ---------- game screen ---------- */
  .game-wrap { max-width: 1180px; margin: 0 auto; padding: 14px 16px 40px; }
  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px;
    margin-bottom: 16px;
  }
  .seg {
    display: inline-flex;
    border: 3px solid var(--ink);
    border-radius: 16px;
    background: #fff;
    box-shadow: 0 5px 0 var(--ink);
    overflow: hidden;
  }
  .seg button {
    padding: 7px 16px;
    font-size: 1rem; font-weight: 800;
    background: transparent;
    border: none;
    cursor: pointer;
  }
  .seg button + button { border-left: 3px solid var(--ink); }
  .seg button.on { background: var(--yellow); }
  .seg button:hover:not(.on) { background: #fff7d6; }
  .seg button:focus-visible { outline: 3px solid var(--coral); outline-offset: -5px; }
  .btn.toggle.on { background: var(--green); }
  .kind-tag { display: inline-block; margin-bottom: 4px; padding: 0 10px; font-size: 0.75rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; border: 2px solid var(--ink); border-radius: 999px; background: #e5f8ff; }

  .game-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
    gap: 22px;
    align-items: start;
  }
  .stage {
    position: relative;
    background-color: var(--paper);
    background-image: radial-gradient(circle, rgba(43,22,64,0.08) 2px, transparent 2.5px);
    background-size: 24px 24px;
    border: 4px solid var(--ink);
    border-radius: 30px;
    box-shadow: 0 9px 0 var(--ink);
    padding: 10px;
  }
  .quiz-banner {
    display: none;
    margin: 4px 4px 8px;
    padding: 10px 16px;
    font-size: 1.15rem; font-weight: 800; line-height: 1.25;
    text-align: center;
    background: var(--yellow);
    border: 3px solid var(--ink);
    border-radius: 18px;
  }
  .quiz-banner small { display: block; font-size: 0.8rem; opacity: 0.7; letter-spacing: 0.06em; text-transform: uppercase; }
  .stage.quiz .quiz-banner { display: block; }
  .quiz-banner .fb { display: block; font-size: 0.9rem; min-height: 0; }
  .quiz-banner .fb:empty { display: none; }
  .quiz-banner .fb.good { color: #1f7a1f; }
  .quiz-banner .fb.bad { color: #b3261e; }
  #cell { display: block; width: 100%; height: auto; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

  /* parts */
  .part { cursor: pointer; }
  .part:hover > .pos { filter: brightness(1.07); }
  .bob { animation: bob 3.2s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .fx { transform-box: fill-box; transform-origin: center; }
  .eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
  .part.selected > .pos, .part.correct > .pos {
    animation: glow 0.9s ease-in-out infinite alternate;
  }
  @keyframes glow {
    from { filter: drop-shadow(0 0 2px #fff36b) drop-shadow(0 0 4px #ffb800); }
    to   { filter: drop-shadow(0 0 7px #fff36b) drop-shadow(0 0 12px #ffb800); }
  }
  .part.correct > .pos { animation-name: glow-green; }
  @keyframes glow-green {
    from { filter: drop-shadow(0 0 3px #b6ff7a) drop-shadow(0 0 6px #3ccf3c); }
    to   { filter: drop-shadow(0 0 9px #b6ff7a) drop-shadow(0 0 14px #3ccf3c); }
  }
  .part.hint > .pos { animation: glow 0.45s ease-in-out infinite alternate; }
  .part.wrong .fx { animation: shake 0.45s ease; }
  @keyframes shake {
    0%,100% { transform: translateX(0) rotate(0); }
    20% { transform: translateX(-6px) rotate(-4deg); }
    40% { transform: translateX(6px) rotate(4deg); }
    60% { transform: translateX(-4px) rotate(-2deg); }
    80% { transform: translateX(4px) rotate(2deg); }
  }
  .part.selected .fx, .part.correct .fx { animation: boing 0.5s ease; }
  @keyframes boing {
    0% { transform: scale(1); } 30% { transform: scale(1.12, 0.9); } 55% { transform: scale(0.95, 1.06); } 100% { transform: scale(1); }
  }
  .part.big.selected .fx, .part.big.correct .fx { animation: none; }
  .floaty { animation: drift 7s ease-in-out infinite; }
  @keyframes drift { 0%,100% { transform: translate(0,0); } 33% { transform: translate(6px,-5px); } 66% { transform: translate(-5px,4px); } }
  #labels { display: none; }
  #cell.show-labels #labels { display: inline; }
  #labels text { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 15px; fill: var(--ink); }

  /* side panel */
  .side { display: flex; flex-direction: column; gap: 18px; }
  .guide { display: flex; flex-direction: column; }
  .guide-head { display: flex; align-items: flex-end; gap: 8px; margin-left: 6px; }
  .guide-head svg { width: 76px; height: 76px; flex: none; }
  .guide-name { font-weight: 800; font-size: 1.05rem; margin-bottom: 14px; }
  .bubble {
    position: relative;
    margin-top: 10px;
    padding: 16px 18px;
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 22px;
    box-shadow: 0 6px 0 var(--ink);
    font-size: 1rem; font-weight: 600; line-height: 1.4;
    min-height: 120px;
  }
  .bubble::before {
    content: ''; position: absolute; left: 34px; top: -14px;
    width: 22px; height: 22px;
    background: #fff;
    border-left: 3px solid var(--ink); border-top: 3px solid var(--ink);
    transform: rotate(45deg);
  }
  .bubble.pop { animation: bubble-pop 0.3s ease; }
  @keyframes bubble-pop { 0% { transform: scale(0.94); } 60% { transform: scale(1.03); } 100% { transform: scale(1); } }
  .part-title {
    display: flex; align-items: center; gap: 10px;
    font-size: 1.45rem; font-weight: 800; line-height: 1.1;
    margin-bottom: 4px;
  }
  .swatch { width: 22px; height: 22px; flex: none; border-radius: 50%; border: 3px solid var(--ink); }
  .new-badge {
    font-size: 0.7rem; font-weight: 800; letter-spacing: 0.08em;
    padding: 1px 8px; border-radius: 999px;
    background: var(--coral); color: #fff; border: 2px solid var(--ink);
  }
  .fullname { font-size: 0.85rem; opacity: 0.65; margin-bottom: 6px; }
  .info-row { margin-top: 10px; padding: 8px 12px; border-radius: 14px; background: #f3f0ff; }
  .info-row b { display: block; font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; }
  .info-row.like { background: #e5f8ff; }
  .info-row.fact { background: #fff4cc; }
  .bubble .btn { margin-top: 12px; }
  .bubble p + p { margin-top: 8px; }

  .progress-card {
    padding: 14px 16px 16px;
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 22px;
    box-shadow: 0 6px 0 var(--ink);
  }
  .progress-head { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 1.05rem; }
  .meter { margin-top: 8px; height: 16px; border: 3px solid var(--ink); border-radius: 999px; background: #fff; overflow: hidden; }
  .meter > div { height: 100%; width: 0; background: repeating-linear-gradient(45deg, #6fdc5a 0 10px, #8be36b 10px 20px); transition: width 0.4s ease; }
  .stickers { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .sticker {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px 3px 4px;
    font-size: 0.85rem; font-weight: 800;
    background: #fff;
    border: 2px solid var(--ink);
    border-radius: 999px;
    cursor: pointer;
  }
  .sticker .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--ink); background: #ddd; }
  .sticker.locked { opacity: 0.55; }
  .sticker.locked .dot { background: repeating-linear-gradient(45deg, #ccc 0 3px, #eee 3px 6px); }
  .sticker.current { background: #fff36b; }
  .sticker:focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; }
  .star-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
  .star-row svg { width: 30px; height: 30px; }
  .big-stars { display: flex; justify-content: center; flex-wrap: wrap; gap: 2px; margin: 8px 0; }
  .big-stars svg { width: 34px; height: 34px; }

  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }


  /* ---------- intro cinematic ---------- */
  .intro-wrap { max-width: 980px; margin: 0 auto; padding: 14px 16px 40px; }
  .cine {
    position: relative;
    border: 4px solid var(--ink);
    border-radius: 26px;
    box-shadow: 0 9px 0 var(--ink);
    overflow: hidden;
    background: #ffe7b3;
    cursor: pointer;
  }
  #scene { display: block; width: 100%; height: auto; }
  #cam { transition: transform 1.3s cubic-bezier(.6,0,.3,1); }
  .cine-start {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background: rgba(43,22,64,0.55);
    cursor: default;
    text-align: center;
    padding: 16px;
  }
  .cine-start.hidden { display: none; }
  .cine-kicker { color: #fff; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; font-size: 0.95rem; }
  .cine-title {
    font-size: clamp(2rem, 7vw, 3.6rem); font-weight: 800; line-height: 1;
    color: var(--yellow);
    -webkit-text-stroke: 7px var(--ink); paint-order: stroke fill;
    text-shadow: 0 6px 0 var(--ink);
    margin-bottom: 8px;
  }
  .btn.big { font-size: 1.25rem; padding: 10px 26px; }
  .cine-skip {
    position: absolute; top: 12px; right: 12px;
    padding: 4px 14px; font-size: 0.9rem;
    display: none;
  }
  .cine.playing .cine-skip { display: inline-flex; }
  .subs {
    position: relative;
    margin-top: 18px;
    min-height: 92px;
    padding: 14px 18px 12px;
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 20px;
    box-shadow: 0 6px 0 var(--ink);
    font-size: 1.2rem; font-weight: 700; line-height: 1.35;
    visibility: hidden;
  }
  .subs.on { visibility: visible; }
  .subs .speaker {
    display: inline-block;
    margin-right: 8px;
    padding: 0 12px;
    border: 3px solid var(--ink);
    border-radius: 999px;
    font-weight: 800; font-size: 0.95rem;
    vertical-align: 2px;
  }
  .subs-hint { position: absolute; right: 14px; bottom: 4px; font-size: 0.75rem; opacity: 0.45; font-weight: 700; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 60; transition: opacity 0.6s ease; }
  #flash.on { opacity: 1; }
  .title-actions { margin-top: 22px; }

  /* scene animation */
  .kid .hop, .kid-hands .hop { transform-box: fill-box; transform-origin: bottom center; }
  .kid.cheer .hop, .kid-hands.cheer .hop { animation: cheer 0.45s ease-in-out infinite alternate; }
  @keyframes cheer { from { transform: translateY(0); } to { transform: translateY(-12px); } }
  .m-o { display: none; }
  .kid.gasp .m-o, .kid.wow .m-o { display: inline; }
  .kid.gasp .m-smile, .kid.wow .m-smile { display: none; }
  .yay { opacity: 0; transform-box: fill-box; transform-origin: center bottom; transform: scale(0.3); transition: opacity 0.2s ease, transform 0.25s cubic-bezier(.3,1.6,.5,1); }
  .yay.on { opacity: 1; transform: scale(1); }
  .t-talk { display: none; }
  .teacher.talking .t-talk { display: inline; }
  .teacher.talking .t-smile { display: none; }
  .t-talk { transform-box: fill-box; transform-origin: center; animation: talk 0.22s ease-in-out infinite alternate; }
  @keyframes talk { from { transform: scaleY(0.35); } to { transform: scaleY(1); } }
  .arm-up { display: none; }
  .teacher.holding .arm-up { display: inline; }
  .teacher.holding .arm-down { display: none; }
  .board-part { opacity: 0; transition: opacity 0.6s ease; }
  .board-part.on { opacity: 1; }
  #mach-pos { transition: transform 0.9s ease-in-out, opacity 0.3s ease; opacity: 0; }
  #mach-pos.on { opacity: 1; }
  #mach-hop.hop { animation: mach-hop 0.9s ease-in-out; }
  @keyframes mach-hop { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-46px); } }
  #mach-shake { transform-box: fill-box; transform-origin: center; }
  .machine.active #mach-shake { animation: mach-shake 0.08s linear infinite; }
  @keyframes mach-shake { 0% { transform: translate(-1.5px, 0) rotate(-2deg); } 50% { transform: translate(1.5px, -1px) rotate(2deg); } 100% { transform: translate(-1px, 1px) rotate(-1deg); } }
  .mlight { animation: mlight 1.2s steps(2) infinite; }
  .machine.active .mlight { animation-duration: 0.15s; }
  @keyframes mlight { 0% { fill: #6bff8a; } 50% { fill: #1f8a3a; } }
  .machine.active .mscreen { animation: mscreen 0.3s linear infinite; }
  @keyframes mscreen { 0% { fill: #ff3bd5; } 33% { fill: #3bd5ff; } 66% { fill: #ffe53b; } }
  .machine.pressed .mbtn { transform-box: fill-box; transform-origin: bottom center; transform: scaleY(0.6); filter: drop-shadow(0 0 6px #ff3b3b); }
  #leo-hand { transition: none; }
  #leo-hand.press { animation: press 0.7s ease-in-out forwards; }
  @keyframes press {
    0% { transform: translate(0, 0); }
    55% { transform: translate(-8px, -78px); }
    80% { transform: translate(-8px, -60px); }
    100% { transform: translate(-8px, -62px); }
  }
  .leo-spin { transform-box: view-box; transform-origin: 690px 290px; }
  .leo-spin.swept { animation: swept 1.7s cubic-bezier(.5,0,.8,.4) forwards; }
  @keyframes swept {
    0% { transform: translate(0, 0) rotate(0) scale(1); }
    25% { transform: translate(0, -10px) rotate(-30deg) scale(1.05); }
    100% { transform: translate(0, 24px) rotate(1080deg) scale(0); }
  }
  #vortex { opacity: 0; transition: opacity 0.4s ease; }
  #vortex.on { opacity: 1; }
  #vortex .ring { transform-box: fill-box; transform-origin: center; animation: spin 1s linear infinite; }
  #vortex .ring.r2 { animation-duration: 0.7s; animation-direction: reverse; }
  #vortex .ring.r3 { animation-duration: 1.4s; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #vortex-grow { transform-box: fill-box; transform-origin: center; transform: scale(0.1); transition: transform 1.2s ease-out; }
  #vortex.on #vortex-grow { transform: scale(1); }
  #vortex.off #vortex-grow { transform: scale(0); transition-duration: 0.6s; }

  /* ---------- arrival: the dark world outside the cell ---------- */
  .cine.arrive { background: #0b0820; cursor: default; }
  #arena { display: block; width: 100%; height: auto; touch-action: none; user-select: none; -webkit-user-select: none; }
  .pad { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 16px; visibility: hidden; }
  .pad.on { visibility: visible; }
  .pad .group { display: flex; gap: 12px; }
  .pad .btn { font-size: 1.5rem; padding: 10px 0; width: 84px; touch-action: none; user-select: none; -webkit-user-select: none; }
  .pad .btn.jump { width: 140px; background: var(--yellow); font-size: 1.15rem; }
  .pad .btn.held { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); filter: brightness(0.95); }
  .pad .keys-hint { font-weight: 700; font-size: 0.9rem; opacity: 0.7; text-align: center; }
  .a-speck { animation: twinkle 3s ease-in-out infinite alternate; }
  @keyframes twinkle { from { opacity: 0.15; } to { opacity: 0.8; } }
  .a-drift { animation: drift 9s ease-in-out infinite; }
  .a-vortex { opacity: 0; transition: opacity 0.4s ease; }
  .a-vortex.on { opacity: 1; }
  .a-vortex .ring { transform-box: fill-box; transform-origin: center; animation: spin 0.9s linear infinite; }
  .a-vortex .ring.r2 { animation-direction: reverse; animation-duration: 0.6s; }
  #a-kid .leg { transform-box: fill-box; transform-origin: top center; }
  #a-kid.walking .l1 { animation: legswing 0.26s ease-in-out infinite alternate; }
  #a-kid.walking .l2 { animation: legswing 0.26s ease-in-out infinite alternate-reverse; }
  @keyframes legswing { from { transform: rotate(-22deg); } to { transform: rotate(22deg); } }
  #a-kid.airborne .l1 { transform: rotate(-28deg); }
  #a-kid.airborne .l2 { transform: rotate(18deg); }
  #a-chan { opacity: 0.35; }
  #a-chan.open { animation: chan 0.45s ease-in-out infinite alternate; }
  @keyframes chan { from { opacity: 0.5; } to { opacity: 1; } }
  .a-prot-face .eyes { animation: blink 3.6s infinite; }
  .layer-tag { opacity: 0; transition: opacity 0.5s ease; }
  .layer-tag.on { opacity: 1; }
  .layer-tag .tick { display: none; }
  .layer-tag.done rect { fill: #b6ff7a; }
  .layer-tag.done .tick { display: inline; }
  #a-flash { opacity: 0; transition: opacity 0.35s ease; pointer-events: none; }
  #a-flash.on { opacity: 1; transition-duration: 0.12s; }

  /* swimmer */
  .swimmer .fin { transform-box: fill-box; transform-origin: right center; animation: kick 0.35s ease-in-out infinite alternate; }
  .swimmer .fin.f2 { animation-direction: alternate-reverse; }
  @keyframes kick { from { transform: rotate(-16deg); } to { transform: rotate(16deg); } }
  .bubl { animation: bubl 1.1s ease-out forwards; }
  @keyframes bubl { to { transform: translate(-4px, -28px); opacity: 0; } }

  /* swim mode in the game */
  .stage.swim #cell { touch-action: none; cursor: crosshair; }
  .swim-hint { display: none; margin: 8px 6px 2px; font-size: 0.9rem; font-weight: 700; text-align: center; opacity: 0.75; }
  .stage.swim .swim-hint { display: block; }
  .swim-toast {
    position: absolute; left: 50%; top: 22px; transform: translate(-50%, -8px) scale(0.9);
    padding: 4px 16px; font-weight: 800; font-size: 1.1rem; white-space: nowrap;
    background: #fff; border: 3px solid var(--ink); border-radius: 999px; box-shadow: 0 4px 0 var(--ink);
    opacity: 0; pointer-events: none; transition: opacity 0.25s ease, transform 0.25s cubic-bezier(.3,1.6,.5,1);
  }
  .swim-toast.on { opacity: 1; transform: translate(-50%, 0) scale(1); }
  .swim-toast .new-badge { margin-left: 6px; vertical-align: 2px; }

  @media (max-width: 900px) {
    .game-grid { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 560px) {
    .pick-row { grid-template-columns: minmax(0, 1fr); gap: 18px; }
    .seg button { padding: 6px 11px; font-size: 0.9rem; }
    .btn { padding: 6px 12px; font-size: 0.9rem; }
    .stage { padding: 6px; border-radius: 22px; }

  @media (prefers-reduced-motion: reduce) {
    .bob, .eyes, .floaty, .title-mascot, .part .fx { animation: none !important; }

<script>
(function(){
  'use strict';

  // ================= colors =================
  const INK = '#2b1640';
  const C = {
    membraneA: '#ff8fb8', cytoA: '#ffe9f2', cytoAdot: '#ff9fc4',
    nucleus: '#a77bff', nucleusRing: '#c9adff', chromatin: '#8455ee', nucleolus: '#6b3fd1',
    mito: '#ff9f43', mitoIn: '#ffd9ab', cristae: '#e8731c',
    ribo: '#3d2c8d',
    rough: '#6cb8ff', smooth: '#3fd0b0', golgi: '#ffd23f',
    lyso: '#ff6b6b', lysoDot: '#c93c4f',
    vac: '#9be7ff', centro: '#b8e04a', centroLine: '#6f9a12',
    wall: '#9bd56f', wallDark: '#5e9c3f',
    cytoP: '#effce0', cytoPdot: '#a5d98a', membraneP: '#ffcd4d',
    chloro: '#49c25a', chloroIn: '#8fe07f', grana: '#23863a',
    cvac: '#a9e4ff', cvacWave: '#62c3ee',
    capsule: '#fff1a8', bwall: '#7ed9a0', bwallDark: '#3f9c68', cytoB: '#e6f6ff', cytoBdot: '#8fc6ee',
    nucleoid: '#a77bff', plasmid: '#ff6b9a', flagellum: '#6cb8ff', pili: '#ffb35c',

  // ================= the parts =================
  const PARTS = {
    membrane: {
      name: 'Cell Membrane', color: C.membraneA,
      job: 'A thin, bendy skin around the cell. It decides what gets in (like food and water) and what goes out (like waste).',
      like: 'A security guard at the door, checking who comes in and out.',
      fact: 'It’s made of fatty molecules lined up in two rows, tail-to-tail, like a double row of tiny lollipops!',
      clues: ['Tap the part that controls what goes in and out of the cell!', 'Find the thin, bendy skin that wraps around the cell!'],
    },
    cytoplasm: {
      name: 'Cytoplasm', color: '#ffc2da',
      job: 'The squishy jelly that fills the cell. All the other parts float in it, and lots of the cell’s chemistry happens here.',
      like: 'The streets and parks of a city, where everyone gets around.',
      fact: 'Cytoplasm is mostly water, which is why cells are so squishy!',
      clues: ['Tap the jelly that all the cell parts float in!', 'Find the squishy, watery stuff that fills the cell!'],

    nucleus: {
      name: 'Nucleus', color: C.nucleus,
      job: 'The control center! It holds the DNA, the instruction book that tells the cell how to grow, work and make copies of itself.',
      like: 'The mayor’s office, or the cell’s brain.',
      fact: 'If you stretched out all the DNA from just one of your cells, it would be about 2 meters long, taller than a grown-up!',
      clues: ['Tap the control center that holds the DNA!', 'Where does the cell keep its instruction book?'],
    },
    mitochondria: {
      name: 'Mitochondria', color: C.mito,
      job: 'The powerhouses! They turn food (sugar) and oxygen into energy the cell can use.',
      like: 'A power plant that keeps all the lights on.',
      fact: 'Mitochondria have their own tiny bit of DNA, and you got all of yours from your mom!',
      clues: ['Tap the powerhouse that makes energy for the cell!', 'Which part turns food into energy?'],
    },
    ribosome: {
      name: 'Ribosomes', color: C.ribo,
      job: 'Tiny builders that read instructions from the DNA and use them to put together proteins.',
      like: 'Workers in a factory, snapping parts together.',
      fact: 'One cell can have millions of ribosomes! They’re the little dots floating around.',
      clues: ['Tap one of the tiny floating dots that build proteins!', 'Find a little protein builder floating in the jelly!'],
    },
    roughER: {
      name: 'Rough ER', full: 'Rough Endoplasmic Reticulum', color: C.rough,
      job: 'Folded tubes covered in ribosomes. Proteins get built here and then sent off to be packed up.',
      like: 'A factory assembly line.',
      fact: 'It looks bumpy, or “rough”, because ribosomes are stuck all over it!',

    },
    smoothER: {
      name: 'Smooth ER', full: 'Smooth Endoplasmic Reticulum', color: C.smooth,
      job: 'Wiggly tubes with no ribosomes. They make fats and help clean harmful stuff out of the cell.',
      like: 'A workshop that makes oils and cleaning supplies.',
      fact: 'Your liver cells are packed with smooth ER to help break down things that could hurt you.',
      clues: ['Tap the smooth, wiggly tubes that make fats!', 'Find the tubes that have NO bumps on them!'],
    },
    golgi: {
      name: 'Golgi Apparatus', color: C.golgi,
      job: 'Packs proteins into little bubbles called vesicles and ships them to where they need to go.',
      like: 'The post office of the cell.',
      fact: 'It’s named after Camillo Golgi, an Italian scientist who discovered it in 1898.',
      clues: ['Tap the cell’s post office that packs and ships proteins!', 'Find the stack of curvy pancakes that wraps up packages!'],
    },
    lysosome: {
      name: 'Lysosomes', color: C.lyso,
      job: 'Little bubbles full of digestive juices. They break down waste and worn-out cell parts.',
      like: 'The recycling and clean-up crew.',
      fact: 'Lysosomes are acidic inside, which helps their special enzymes chop things into tiny pieces.',
      clues: ['Tap the clean-up crew that breaks down waste!', 'Which little bubble recycles old cell parts?'],
    },
    vacuole: {
      name: 'Vacuole', color: C.vac,
      job: 'A small storage bubble that holds water, food or waste until the cell needs it.',
      like: 'A storage closet.',
      fact: 'Animal cells have small vacuoles, but plant cells have one GIANT one!',

    },
    centrosome: {
      name: 'Centrosome', color: C.centro,
      job: 'Helps the cell split in two by organizing fibers that pull the copied DNA apart.',
      like: 'A coach directing the team during a big play.',
      fact: 'It has two tiny tube bundles called centrioles that sit at right angles to each other.',
      clues: ['Tap the part that helps the cell split in two!', 'Find the two little striped tubes sitting at right angles!'],
    },
    wall: {
      name: 'Cell Wall', color: C.wall,
      job: 'A tough, stiff layer outside the membrane. It protects the plant cell and keeps its boxy shape.',
      like: 'The strong walls of a castle.',
      fact: 'Cell walls are made of cellulose, the same stuff that paper and cotton are made of!',

    chloroplast: {
      name: 'Chloroplasts', color: C.chloro,

    },
    centralVacuole: {
      name: 'Central Vacuole', color: C.cvac,
      job: 'A huge water balloon. It stores water and pushes against the wall to keep the plant firm.',
      like: 'A water tower for the whole cell.',
      fact: 'When a plant doesn’t get enough water, its vacuoles shrink. That’s why it wilts and droops!',
      clues: ['Tap the giant water balloon of the plant cell!', 'Which part keeps a plant from wilting?'],
    },
    capsule: {
      name: 'Capsule', color: C.capsule,
      job: 'A slimy, sticky coat around the outside of the bacterium. It helps it stick to things and hide from your body’s germ fighters.',
      like: 'A slippery raincoat.',
      fact: 'Capsules help some bacteria stick to your teeth. That’s part of how plaque forms, so keep brushing!',

    nucleoid: {
      name: 'Nucleoid', color: C.nucleoid,
      job: 'The area where the bacterium keeps its DNA. There’s no nucleus around it, so the DNA just floats in a big tangled loop!',
      like: 'Instruction pages piled on an open desk instead of locked in an office.',
      fact: 'Having NO nucleus is exactly what makes a cell prokaryotic. “Pro-karyotic” means “before the nucleus”!',
      clues: ['Tap the tangled DNA that floats with no nucleus around it!', 'Where does a bacterium keep its main instruction book?'],
    },
    plasmid: {
      name: 'Plasmids', color: C.plasmid,
      job: 'Tiny extra rings of DNA with bonus instructions, like how to survive certain medicines.',
      like: 'Trading cards with special powers.',
      fact: 'Bacteria can pass plasmids to their neighbors, sharing new tricks with each other!',
      clues: ['Tap one of the tiny extra rings of DNA!', 'Find the little bonus DNA loops that bacteria can share!'],
    },
    flagellum: {
      name: 'Flagellum', color: C.flagellum,
      job: 'A long, whip-like tail that spins like a propeller to push the bacterium through water.',
      like: 'The motor on the back of a speedboat.',
      fact: 'Some flagella can spin more than 100 times every second!',
      clues: ['Tap the long tail that spins to make the bacterium swim!', 'Which part works like a propeller?'],
    },
    pili: {
      name: 'Pili', color: C.pili,
      job: 'Short, hair-like threads all over the outside. They help the bacterium grab onto surfaces and other cells.',
      like: 'Velcro hooks.',
      fact: 'Just one is called a pilus. Some bacteria use pili like grappling hooks to pull themselves along!',
      clues: ['Tap the short little hairs that stick out all around!', 'Find the tiny threads that help bacteria grab on to things!'],
    },
  };

  // Some parts work a bit differently depending on the cell.
  const OVERRIDES = {
    prokaryote: {
      wall: {
        color: C.bwall,
        job: 'A tough layer just outside the membrane. It gives the bacterium its shape and keeps it from bursting.',
        like: 'A suit of armor.',
        fact: 'Bacteria walls are made of something called peptidoglycan, not cellulose like plants. The medicine penicillin works by breaking it!',
        clues: ['Tap the tough layer that keeps the bacterium from bursting!', 'Find the strong layer between the slimy coat and the membrane!'],
      },
      ribosome: {
        fact: 'Bacteria ribosomes are a bit smaller than yours, so some medicines can jam them without hurting your own cells!',
      },
      cytoplasm: {
        color: '#bfe4ff',
        job: 'The watery jelly inside the bacterium. The DNA, ribosomes and plasmids all float around in it.',
      },
    },
  };
  function info(id, cell) {
    return Object.assign({}, PARTS[id], (OVERRIDES[cell || state.cell] || {})[id] || {});
  }

  // ================= drawing helpers =================
  const fmt = p => p[0].toFixed(1) + ' ' + p[1].toFixed(1);
  const rnd = (a, b) => a + Math.random() * (b - a);

  function smoothPath(pts, closed) {
    const n = pts.length;
    const get = i => closed ? pts[(i + n) % n] : pts[Math.max(0, Math.min(n - 1, i))];
    let d = 'M' + fmt(pts[0]);
    const last = closed ? n : n - 1;
    for (let i = 0; i < last; i++) {
      const p0 = get(i - 1), p1 = get(i), p2 = get(i + 1), p3 = get(i + 2);
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
      const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      d += ' C' + fmt(c1) + ' ' + fmt(c2) + ' ' + fmt(p2);
    }
    return d + (closed ? 'Z' : '');
  }
  function blob(cx, cy, rx, ry, n, amp, ph) {
    const pts = [];
    for (let i = 0; i < n; i++) {
      const a = i / n * Math.PI * 2;
      const k = 1 + amp * Math.sin(3 * a + ph) + amp * 0.6 * Math.sin(5 * a + ph * 2);
      pts.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]);
    }
    return smoothPath(pts, true);
  }
  function arcPts(cx, cy, r, a0, a1, wob, n) {
    n = n || 18;
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      const a = (a0 + (a1 - a0) * t) * Math.PI / 180;
      const rr = r + wob * Math.sin(t * Math.PI * 4);
      pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]);
    }
    return pts;
  }
  function face(x, y, s) {
    const d = rnd(0, 4.5).toFixed(2);
    return `<g transform="translate(${x} ${y}) scale(${s})">
      <ellipse cx="-16" cy="6" rx="4.5" ry="2.8" fill="#ff4f86" opacity=".45"/>
      <ellipse cx="16" cy="6" rx="4.5" ry="2.8" fill="#ff4f86" opacity=".45"/>
      <g class="eyes" style="animation-delay:-${d}s">
        <ellipse cx="-8.5" cy="-4" rx="6" ry="7.5" fill="#fff" stroke="${INK}" stroke-width="2.5"/>
        <ellipse cx="8.5" cy="-4" rx="6" ry="7.5" fill="#fff" stroke="${INK}" stroke-width="2.5"/>
        <circle cx="-7.5" cy="-2.5" r="3.5" fill="${INK}"/><circle cx="9.5" cy="-2.5" r="3.5" fill="${INK}"/>
        <circle cx="-6.2" cy="-4.2" r="1.4" fill="#fff"/><circle cx="10.8" cy="-4.2" r="1.4" fill="#fff"/>
      </g>
      <path d="M-6 6 Q0 13 6 6" fill="none" stroke="${INK}" stroke-width="2.6" stroke-linecap="round"/>
    </g>`;
  }
  function shine(cx, cy, rx, ry, rot) {
    return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#fff" opacity=".55" transform="rotate(${rot == null ? -30 : rot} ${cx} ${cy})"/>`;
  }
  function tube(d, color, w) {
    return `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w + 9}" stroke-linecap="round" stroke-linejoin="round"/>` +
      `<path d="${d}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>` +
      `<path d="${d}" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="${Math.max(2, w * 0.22).toFixed(1)}" stroke-linecap="round" transform="translate(-1 -2)"/>`;
  }
  function part(id, x, y, rot, scale, inner, opts) {
    opts = opts || {};
    let t = `translate(${x} ${y})`;
    if (rot) t += ` rotate(${rot})`;
    if (scale && scale !== 1) t += ` scale(${scale})`;
    const bob = opts.bob === false ? '' : 'bob';
    return `<g class="part${opts.big ? ' big' : ''}" data-part="${id}"><g class="pos" transform="${t}">` +
      `<g class="${bob}" style="animation-delay:-${rnd(0, 3.2).toFixed(2)}s"><g class="fx">${inner}</g></g></g></g>`;
  }
  function star(filled) {
    return `<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3 L25 14.5 L37.5 15.5 L28 24 L31 36.5 L20 30 L9 36.5 L12 24 L2.5 15.5 L15 14.5 Z" fill="${filled ? '#ffd23f' : '#e9e4f2'}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>${filled ? '<ellipse cx="16" cy="16" rx="4" ry="2.2" fill="#fff" opacity=".7" transform="rotate(-30 16 16)"/>' : ''}</svg>`;
  }

  // ---------- organelle shapes (drawn around 0,0) ----------
  const SHAPE = {
    nucleus() {
      return `<circle r="78" fill="${C.nucleus}" stroke="${INK}" stroke-width="6"/>
        <circle r="66" fill="none" stroke="${C.nucleusRing}" stroke-width="4" stroke-dasharray="1 12" stroke-linecap="round"/>

      let j = 0;
      for (let a = A0 + step * 0.6; a < A1 - step * 0.3; a += step, j++) {
        const t = (a - A0) / (A1 - A0);

        dots += `<circle cx="${(cx + Math.cos(rad) * rr).toFixed(1)}" cy="${(cy + Math.sin(rad) * rr).toFixed(1)}" r="4.3" fill="${C.ribo}" stroke="${INK}" stroke-width="1.5"/>`;

    if (!state.sound) return;

      const t = ac.currentTime + (delay || 0);
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      g.gain.setValueAtTime(vol || 0.12, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) { /* no audio available */ }
  }

  const cv = document.getElementById('confetti');
  const cx2 = cv.getContext('2d');
  let bits = [], confettiRunning = false;
  function confetti() {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    cv.width = innerWidth; cv.height = innerHeight;
    const cols = ['#ff8fb8', '#ffd23f', '#8be36b', '#6cb8ff', '#a77bff', '#ff9f43'];
    for (let i = 0; i < 140; i++) {
      bits.push({ x: innerWidth / 2 + rnd(-80, 80), y: innerHeight * 0.35, vx: rnd(-9, 9), vy: rnd(-15, -5), r: rnd(5, 10), c: cols[i % cols.length], rot: rnd(0, 6), vr: rnd(-0.3, 0.3), round: Math.random() < 0.4 });
    }
    if (!confettiRunning) { confettiRunning = true; requestAnimationFrame(tick); }
  }
  function tick() {
    cx2.clearRect(0, 0, cv.width, cv.height);
    bits.forEach(b => {
      b.vy += 0.35; b.vx *= 0.99; b.x += b.vx; b.y += b.vy; b.rot += b.vr;
      cx2.save(); cx2.translate(b.x, b.y); cx2.rotate(b.rot);

      tone(1300, 1.6, 'triangle', 0.1, 0, 90);
      await line('Emmett', 'WHOA-WHOA-WHOAAAAAA!', { hold: 900 });
      stopWhirr();
      q1('#vortex').classList.add('off');
      q1('#machine').classList.remove('active');
      camTo(400, 225, 1);
      kids('gasp', true, ['westley', 'abby', 'cole']);
      await iwait(1300);
      await line('Class', 'EMMETT?!', { hold: 600 });
      await line('Ms. Bolebrunch', 'Oh my. Well... it looks like Emmett is going on our field trip a little early!');
      await line('Ms. Bolebrunch', 'Hang on, Emmett! Explore that cell, and we’ll figure out how to get you back!');

  function finishIntro() {

    intro.advance = intro.finishType = intro.cancel = null;
    try { speechSynthesis.cancel(); } catch (e) {}
    stopWhirr();
    cine.classList.remove('playing');
    $('cine-start').classList.remove('hidden');
    showTitleAfterStory();

  function arrivePlaying() { return $('screen-arrive').classList.contains('active') && arr.phase === 'play'; }

  addEventListener('keydown', e => {
    const k = KEYMAP[e.key];
    if (!k || e.ctrlKey || e.metaKey || e.altKey) return;

    if (!inArrive && !inSwim) return;
    if (inSwim && e.key === ' ') return; // space keeps pressing buttons in the game
    e.preventDefault();

    keys[k] = true;

  addEventListener('keyup', e => { const k = KEYMAP[e.key]; if (k) keys[k] = false; });

  const arena = $('arena'), pad = $('pad');

  const CYTO = { animal: C.cytoA, plant: C.cytoP, prokaryote: C.cytoB };

  function arenaMarkup(cell) {
    let s = `<defs>

    </defs>

    // far-away stuff (parallax): other cells' silhouettes and drifting specks

    [[260, 120, 70], [620, 380, 110], [1100, 90, 55], [40, 400, 60]].forEach(b => { s += `<circle cx="${b[0]}" cy="${b[1]}" r="${b[2]}" fill="#2b2160" opacity=".55"/><circle cx="${b[0] + b[2] * 0.2}" cy="${b[1]}" r="${b[2] * 0.3}" fill="#3a2d78" opacity=".6"/>`; });
    for (let i = 0; i < 70; i++) s += `<circle class="a-speck" cx="${rnd(0, 1400).toFixed(0)}" cy="${rnd(0, 450).toFixed(0)}" r="${rnd(0.8, 2.6).toFixed(1)}" fill="${pick(['#fff', '#bfeaff', '#ffd9f0', '#fff36b'])}" style="animation-delay:-${rnd(0, 3).toFixed(2)}s"/>`;
    s += '</g><g id="a-cam">';
    // the giant cell, as nested bands
    let r = SC.r;
    const bands = [];
    LAYERS[cell].forEach(id => { bands.push({ id, r0: r, r1: r - LAYER_W[id] }); r -= LAYER_W[id]; });
    arr.bands = bands; arr.innerR = r;
    const glowCol = layerColors(cell, LAYERS[cell][0]).fill;
    s += `<circle cx="${SC.cx}" cy="${SC.cy}" r="${SC.r + 70}" fill="none" stroke="${glowCol}" stroke-opacity=".07" stroke-width="140"/>`;
    s += `<circle cx="${SC.cx}" cy="${SC.cy}" r="${SC.r + 24}" fill="none" stroke="${glowCol}" stroke-opacity=".16" stroke-width="48"/>`;
    bands.forEach(b => { s += `<circle cx="${SC.cx}" cy="${SC.cy}" r="${b.r0}" fill="${layerColors(cell, b.id).fill}" stroke="${INK}" stroke-width="5"/>`; });
    s += `<circle cx="${SC.cx}" cy="${SC.cy}" r="${r}" fill="${CYTO[cell]}" stroke="${INK}" stroke-width="4"/>`;

      if (b.id === 'capsule') s += `<circle cx="${SC.cx}" cy="${SC.cy}" r="${b.r0 - 8}" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="5" stroke-dasharray="3 16" stroke-linecap="round"/>`;

      `<path d="M${outerX + 14} ${y0 + 8} H${innerX - 14}" stroke="#c9adff" stroke-width="4" stroke-linecap="round" opacity=".8"/>`;

    s += `<g class="a-prot-face"><g class="eyes"><circle cx="${outerX + 3}" cy="${PY - 41}" r="3.2" fill="${INK}"/><circle cx="${outerX + 12}" cy="${PY - 41}" r="3.2" fill="${INK}"/></g>
      <path d="M${outerX + 1} ${PY - 33} Q${outerX + 7.5} ${PY - 28} ${outerX + 14} ${PY - 33}" fill="none" stroke="${INK}" stroke-width="2.5" stroke-linecap="round"/></g>`;
    s += `<text x="${outerX + 30}" y="${PY + 76}" text-anchor="middle" font-family="'Baloo 2', sans-serif" font-weight="800" font-size="14" fill="#fff" opacity=".7">channel protein</text>`;
    // a bacterium's outside bits: lots of short pili and one long, wiggling flagellum
    if (cell === 'prokaryote') {
      for (let th = 167.6; th <= 192.4; th += 0.85) {
        const a = th * Math.PI / 180, y = SC.cy + Math.sin(a) * SC.r;
        if (Math.abs(y - PY) < 70 || (y > 385 && y < 425)) continue;
        const L = 24 + 10 * Math.abs(Math.sin(th * 7)), c = Math.cos(a), sn = Math.sin(a);
        const x0 = SC.cx + c * (SC.r - 4), y0 = SC.cy + sn * (SC.r - 4), x1 = SC.cx + c * (SC.r + L), y1 = SC.cy + sn * (SC.r + L);
        s += `<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} L${x1.toFixed(1)} ${y1.toFixed(1)}" stroke="${INK}" stroke-width="7" stroke-linecap="round"/>` +
          `<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} L${x1.toFixed(1)} ${y1.toFixed(1)}" stroke="${C.pili}" stroke-width="3" stroke-linecap="round"/>`;
      }

      const wave = ph => smoothPath(Array.from({ length: 25 }, (_, i) => { const t = i / 24; return [bx - 330 * t, by + 8 * t + 24 * Math.sqrt(t) * Math.sin(t * 4 * Math.PI + ph)]; }), false);
      const d1 = wave(0), d2 = wave(Math.PI);

      s += `<path d="${d1}" fill="none" stroke="${C.flagellum}" stroke-width="6" stroke-linecap="round">${anim}</path>`;
      s += `<circle cx="${bx}" cy="${by}" r="10" fill="${C.flagellum}" stroke="${INK}" stroke-width="4"/>`;
      const extraTag = (id, tx, ty, px, py) => {
        const name = info(id, cell).name, w = name.length * 8.4 + 44;

      };
      s += extraTag('flagellum', bx - 420, 372, bx - 250, 398);
      s += extraTag('pili', surfX(190, SC.r) - 150, 190, surfX(190, SC.r + 16), 190);
    }
    // name tags for each layer (tick when Emmett passes through)
    bands.forEach((b, i) => {
      const ty = 56 + i * 42, mid = (b.r0 + b.r1) / 2, bx = surfX(ty, mid), name = info(b.id, cell).name, w = name.length * 8.4 + 44;
      const tx = surfX(ty, SC.r) - 40 - w;
      s += `<g class="layer-tag" id="tag-${b.id}"><path d="M${tx + w} ${ty} H${bx}" stroke="#fff" stroke-width="3" stroke-dasharray="2 6" stroke-linecap="round"/><circle cx="${bx}" cy="${ty}" r="5" fill="#fff" stroke="${INK}" stroke-width="2.5"/>
        <rect x="${tx}" y="${ty - 15}" width="${w}" height="30" rx="15" fill="#fff" stroke="${INK}" stroke-width="3"/>
        <text x="${tx + w / 2}" y="${ty + 6}" text-anchor="middle" font-family="'Baloo 2', sans-serif" font-weight="800" font-size="16" fill="${INK}">${name}<tspan class="tick"> ✓</tspan></text></g>`;
    });
    // floating molecule platforms
    arr.plats = [
      { kind: 'goo', x0: 40, y0: 340, w: 250 },
      { kind: 'sugar', x0: 352, y0: 300, w: 96, ay: 22, sp: 1.6 },
      { kind: 'water', x0: 536, y0: 250, w: 96, ay: 10, sp: 2.2, ph: 1 },
      { kind: 'amino', x0: 722, y0: 318, w: 124, ax: 55, sp: 1.1 },
      { kind: 'fat', x0: 936, y0: 268, w: 96, ay: 20, sp: 1.5, ph: 2 },
      { kind: 'salt', x0: 1094, y0: 222, w: 78, ay: 8, sp: 2, ph: 0.5 },
      { kind: 'protein', x0: outerX - 10, y0: PY - 52, w: surfX(PY - 52, SC.r) - outerX + 4 },
    ];
    arr.plats.forEach((p, i) => {
      p.x = p.x0; p.y = p.y0; p.dx = 0; p.py = p.y0;
      if (p.kind !== 'protein') s += `<g id="plat-${i}" transform="translate(${p.x} ${p.y})">${platMarkup(p)}</g>`;
    });
    // vortex Emmett pops out of
    s += `<g class="a-vortex" id="a-vortex" transform="translate(165 70)">
      <circle class="ring" r="44" fill="none" stroke="#b06bff" stroke-width="9" stroke-dasharray="40 24" stroke-linecap="round"/>
      <circle class="ring r2" r="28" fill="none" stroke="#3bd5ff" stroke-width="8" stroke-dasharray="26 16" stroke-linecap="round"/>
      <circle class="ring" r="12" fill="none" stroke="#fff36b" stroke-width="6" stroke-dasharray="12 8" stroke-linecap="round"/></g>`;
    // Emmett (walking form + swim form)
    const E = KIDS[3];
    const leg = (cls, x) => `<g class="leg ${cls}"><rect x="${x}" y="0" width="14" height="30" rx="6" fill="#3d4a7a" stroke="${INK}" stroke-width="4"/><ellipse cx="${x + 7}" cy="32" rx="11" ry="6" fill="#fff" stroke="${INK}" stroke-width="4"/></g>`;
    s += `<g id="a-player" style="display:none"><g id="a-kid" class="kid">${leg('l1', -20)}${leg('l2', 6)}${kidMarkup(E)}${handsMarkup(E)}</g></g>`;
    s += `<g id="a-swim" style="display:none">${swimmerMarkup()}</g>`;
    s += `<g id="a-bubbles"></g>`;
    s += '</g>';
    s += `<rect id="a-flash" width="800" height="450" fill="#fff"/>`;
    return s;
  }

  // ---------- arrival physics ----------
  const P = { x: 0, y: 0, vx: 0, vy: 0, face: 1, ground: null, coyote: 0, safe: null, scale: PS, hidden: true, swim: false, walking: false };
  function stepPlayer(dt) {
    const ctl = arr.phase === 'play';
    const dir = ctl ? (keys.right ? 1 : 0) - (keys.left ? 1 : 0) : 0;
    P.vx += (dir * RUN - P.vx) * Math.min(1, dt * (P.ground ? 14 : 6));
    if (dir) P.face = dir;
    arr.jumpBuf -= dt; P.coyote -= dt;
    if (P.ground) { P.x += P.ground.dx; P.y = P.ground.y; P.coyote = 0.1; }
    if (ctl && arr.jumpBuf > 0 && (P.ground || P.coyote > 0)) {
      P.vy = -JUMP; P.ground = null; P.coyote = 0; arr.jumpBuf = 0;
      tone(380, 0.16, 'triangle', 0.08, 0, 760);
    }
    P.x += P.vx * dt;
    P.x = Math.max(20, P.x);
    const wallX = surfX(clamp(P.y - 30, -200, 650), SC.r) - 14;
    if (P.x > wallX) { P.x = wallX; P.vx = 0; }
    if (P.ground && (P.x < P.ground.x - 10 || P.x > P.ground.x + P.ground.w + 10)) P.ground = null;
    if (!P.ground) {
      const prevY = P.y;
      // let go of jump early for a little hop
      P.vy = Math.min(P.vy + G * dt * (P.vy < 0 && !keys.up && ctl ? 2.2 : 1), 950);
      P.y += P.vy * dt;
      if (P.vy >= 0) for (const g of arr.plats) {
        if (prevY <= g.py + 2 && P.y >= g.y && P.x >= g.x - 10 && P.x <= g.x + g.w + 10) {
          P.y = g.y; P.vy = 0; P.ground = g; P.safe = g;
          if (ctl) tone(180, 0.08, 'sine', 0.1);
          if (g.kind === 'protein' && ctl && arr.onArrive) arr.onArrive();
          break;
        }
      }
      if (P.y > 640) respawn();
    }
    P.walking = !!P.ground && Math.abs(P.vx) > 30;
  }
  function respawn() {
    const g = P.safe || arr.plats[0];
    P.x = g.x + g.w / 2; P.y = g.y - 160; P.vx = 0; P.vy = 0; P.ground = null;
    sfx.wrong();
    if (arr.phase === 'play') playHint('Whoops! You floated away. Try again: hop from molecule to molecule!');
  }
  function playHint(text) {
    arr.subs.classList.add('on');
    arr.subs.innerHTML = `<span class="speaker" style="background:#ffd23f">Goal</span><span>${esc(text)}</span>`;
  }
  function renderPlayer() {
    const pl = aq('#a-player'), sw = aq('#a-swim');
    pl.style.display = P.hidden || P.swim ? 'none' : '';
    sw.style.display = P.hidden || !P.swim ? 'none' : '';
    if (P.swim) sw.setAttribute('transform', `translate(${P.x.toFixed(1)} ${P.y.toFixed(1)}) scale(${0.9 * P.face} 0.9)`);
    else pl.setAttribute('transform', `translate(${P.x.toFixed(1)} ${P.y.toFixed(1)}) scale(${(P.scale * P.face).toFixed(3)} ${P.scale.toFixed(3)}) translate(0 -38)`);
    const k = aq('#a-kid');
    k.classList.toggle('walking', P.walking);
    k.classList.toggle('airborne', !P.ground && !arr.manual);
  }
  function arrLoop(ts) {
    if (arr.skipped) return;
    const dt = Math.min(0.05, (ts - (arr.last || ts)) / 1000);
    arr.last = ts; arr.t += dt;
    arr.plats.forEach((p, i) => {
      const nx = p.x0 + (p.ax || 0) * Math.sin(arr.t * (p.sp || 1) + (p.ph || 0));
      const ny = p.y0 + (p.ay || 0) * Math.sin(arr.t * (p.sp || 1) + (p.ph || 0));
      p.dx = nx - p.x; p.py = p.y; p.x = nx; p.y = ny;
      if (p.kind !== 'protein') aq('#plat-' + i).setAttribute('transform', `translate(${nx.toFixed(1)} ${ny.toFixed(1)})`);
    });
    if (!arr.manual) stepPlayer(dt);
    const tx = arr.camFollow ? clamp(P.x - 330, 0, AW - 800) : arr.camTarget;
    arr.cam += (tx - arr.cam) * Math.min(1, dt * (arr.camFollow ? 5 : 1.4));
    aq('#a-cam').setAttribute('transform', `translate(${(-arr.cam).toFixed(1)} 0)`);
    aq('#a-far').setAttribute('transform', `translate(${(-arr.cam * 0.3).toFixed(1)} 0)`);
    renderPlayer();
    arr.raf = requestAnimationFrame(arrLoop);
  }
  function tween(ms, fn) {
    return new Promise((res, rej) => {
      if (arr.skipped) return rej(SKIP);
      const t0 = performance.now();
      (function f(now) {
        if (arr.skipped) return rej(SKIP);
        const k = Math.min(1, (now - t0) / ms);
        fn(k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2, k);
        if (k < 1) requestAnimationFrame(f); else res();
      })(t0);
    });
  }
  function aFlash() { const f = aq('#a-flash'); f.classList.add('on'); setTimeout(() => f.classList.remove('on'), 160); }
  function puffBubbles(x, y, n) {
    const g = aq('#a-bubbles');
    for (let i = 0; i < n; i++) {
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', (x + rnd(-30, 30)).toFixed(0)); c.setAttribute('cy', (y + rnd(-20, 20)).toFixed(0)); c.setAttribute('r', rnd(3, 7).toFixed(1));
      c.setAttribute('fill', '#fff'); c.setAttribute('fill-opacity', '.7'); c.setAttribute('stroke', INK); c.setAttribute('stroke-width', '1.5');
      c.setAttribute('class', 'bubl'); c.style.animationDelay = rnd(0, 0.5).toFixed(2) + 's';
      g.appendChild(c); setTimeout(() => c.remove(), 1800);
    }
  }

  // ---------- the arrival story ----------
  async function playArrival(cell) {
    arr.cell = cell;
    arena.innerHTML = arenaMarkup(cell);
    Object.assign(P, { x: 165, y: 60, vx: 0, vy: 0, face: 1, ground: null, safe: arr.plats[0], scale: PS, hidden: true, swim: false });
    Object.assign(arr, { skipped: false, phase: 'cine', manual: true, camFollow: false, camTarget: 0, cam: 0, t: 0, last: 0, jumpBuf: 0, onArrive: null });
    arr.subs.classList.remove('on'); arr.subs.innerHTML = '';
    pad.classList.remove('on');
    $('arrive').classList.add('playing');
    showScreen('arrive');
    arr.raf = requestAnimationFrame(arrLoop);
    const ctx = { ctx: arr };
    const passing = LAYERS[cell].map(id => info(id, cell).name);
    const through = passing.length > 1 ? passing.slice(0, -1).join(', ') + ' and the ' + passing[passing.length - 1] : passing[0];
    try {
      await iwait(400, arr);
      aq('#a-vortex').classList.add('on');
      tone(1300, 0.9, 'triangle', 0.08, 0, 200);
      await iwait(600, arr);
      P.hidden = false; arr.manual = false;          // Emmett tumbles out and lands
      await iwait(900, arr);
      aq('#a-vortex').classList.remove('on');
      await line('Emmett', 'Oof! Wh-where am I? It’s so dark down here...', ctx);
      aq('#a-kid').classList.add('wow');
      arr.camTarget = 880;                            // look over at the glowing cell
      await iwait(2200, arr);
      await line('Emmett', 'Whoa... is that a CELL?! It’s GIGANTIC!', ctx);
      let gooHi = false;
      const goo = text => { const t = gooHi ? text : 'Hi Emmett, it’s Professor Goo! ' + text; gooHi = true; return line('Professor Goo', t, ctx); };
      const partTalk = id => {
        const pi = info(id, cell), like = pi.like.charAt(0).toLowerCase() + pi.like.slice(1);
        return `${id === 'pili' ? 'Those are the' : 'This is the'} ${pi.name}! ${pi.job} It’s like ${like}`;
      };
      if (cell === 'prokaryote') {
        // the flagellum and pili stick OUT of the bacterium, so Goo explains them out here
        for (const id of ['flagellum', 'pili']) {
          aq('#tag-' + id).classList.add('on', 'done');
          sfx.newFind();
          await goo(partTalk(id));
        }
      }
      LAYERS[cell].forEach((id, i) => later2(i * 400, () => { aq('#tag-' + id).classList.add('on'); sfx.pop(); }));
      await line('Ms. Bolebrunch (radio)', 'Emmett! Can you hear me? It’s Ms. Bolebrunch, talking to you through the Micro-Explorer!', ctx);
      await line('Ms. Bolebrunch (radio)', `To get inside, you need to get through the ${through}. They don’t let just anything in!`, ctx);
      await line('Ms. Bolebrunch (radio)', 'See that purple protein poking out? It’s a channel protein, a doorway into the cell. Hop across those floating molecules and jump onto it!', ctx);
      aq('#a-kid').classList.remove('wow');
      arr.camFollow = true;
      arr.phase = 'play';
      pad.classList.add('on');
      playHint('Hop across the floating molecules and jump onto the purple channel protein!');
      await new Promise((res, rej) => { arr.onArrive = res; arr.cancel = () => rej(SKIP); });
      arr.onArrive = null; arr.cancel = null;
      arr.phase = 'cine'; arr.manual = true; P.walking = false; P.vx = 0;
      Object.keys(keys).forEach(k => { keys[k] = false; });
      pad.classList.remove('on');
      sfx.right();
      await line('Emmett', 'Made it! Um... hi there, little protein!', ctx);
      aq('#a-chan').classList.add('open');
      tone(200, 1.2, 'sine', 0.08, 0, 600);
      await line('Ms. Bolebrunch (radio)', 'Hold on tight! The channel is opening up. Here you go!', Object.assign({ hold: 200 }, ctx));
      // slip down into the channel's mouth...
      const x0 = P.x, y0 = P.y, mx = arr.outerX - 6, my = PY + 20;
      await tween(700, k => { P.x = x0 + (mx - x0) * k; P.y = y0 + (my - y0) * k - Math.sin(k * Math.PI) * 50; P.scale = PS - 0.12 * k; });
      // ...and get pulled through every layer, stopping in each one so Professor Goo can explain it
      await goo('Stay still in there and I’ll tell you about each layer you go through.');
      let at = mx;
      for (const b of arr.bands) {
        const stop = surfX(PY, (b.r0 + b.r1) / 2), from = at;
        await tween(Math.max(500, (stop - from) * 14), k => { P.x = from + (stop - from) * k; });
        at = stop;
        aq('#tag-' + b.id).classList.add('done');
        sfx.newFind();
        await line('Professor Goo', partTalk(b.id), ctx);
      }
      const endX = arr.innerX + 70;
      await tween(1400, k => { P.x = at + (endX - at) * k; });
      // suit up!
      aFlash(); sfx.fanfare();
      P.swim = true; P.y = PY; P.face = 1;
      puffBubbles(P.x, P.y, 14);
      await tween(900, k => { P.x = endX + 40 * k; P.y = PY - 30 * k; });
      await line('Emmett', 'Whoa, my suit just changed! Flippers! A bubble helmet!', ctx);
      await line('Ms. Bolebrunch (radio)', 'That’s the Micro-Suit’s SWIM MODE! The inside of a cell is mostly water, so swim around and explore. Professor Goo will tell you about everything you find!', ctx);
      await iwait(300, arr);
    } catch (e) {
      if (e === SKIP) return;
      throw e;
    }
    finishArrival(true);
  }
  function later2(ms, fn) { arr.timers.push(setTimeout(() => { if (!arr.skipped) fn(); }, ms)); }
  function finishArrival(done) {
    if (arr.skipped) return;
    arr.skipped = true;
    arr.phase = 'idle';
    arr.timers.forEach(clearTimeout); arr.timers = [];
    if (arr.cancel) { try { arr.cancel(); } catch (e) {} }
    arr.advance = arr.finishType = arr.cancel = arr.onArrive = null;
    try { speechSynthesis.cancel(); } catch (e) {}
    cancelAnimationFrame(arr.raf);
    Object.keys(keys).forEach(k => { keys[k] = false; });
    $('arrive').classList.remove('playing');
    pad.classList.remove('on');
    const entered = done ? LAYERS[arr.cell].concat(arr.cell === 'prokaryote' ? ['flagellum', 'pili'] : []).filter(id => CELLS[arr.cell].parts.includes(id) && !state.found[arr.cell].has(id)) : [];
    startGame(arr.cell, 'swim', entered);
    const fl = $('flash');
    fl.classList.add('on');
    setTimeout(() => fl.classList.remove('on'), 60);
  }
  $('arrive-skip').onclick = () => { sfx.pop(); finishArrival(false); };
  $('arrive').addEventListener('click', e => {
    if (arr.skipped || e.target.closest('button')) return;
    if (arr.finishType) arr.finishType(); else if (arr.advance) arr.advance();
  });
  arr.subs.addEventListener('click', () => {
    if (arr.skipped) return;
    if (arr.finishType) arr.finishType(); else if (arr.advance) arr.advance();
  });
  pad.querySelectorAll('[data-hold]').forEach(b => {
    const k = b.dataset.hold;
    const on = e => { e.preventDefault(); if (k === 'up') arr.jumpBuf = 0.15; keys[k] = true; b.classList.add('held'); try { b.setPointerCapture(e.pointerId); } catch (er) {} };
    const off = () => { keys[k] = false; b.classList.remove('held'); };
    b.addEventListener('pointerdown', on);
    b.addEventListener('pointerup', off);
    b.addEventListener('pointercancel', off);
    b.addEventListener('lostpointercapture', off);
    b.addEventListener('contextmenu', e => e.preventDefault());
  });

  // =====================================================================
  // ================= SWIM MODE: swim around inside the cell ============
  // =====================================================================
  const inRR = (x, y, x0, y0, x1, y1, r) => {
    if (x < x0 || x > x1 || y < y0 || y > y1) return false;
    const cx = clamp(x, x0 + r, x1 - r), cy = clamp(y, y0 + r, y1 - r);
    return (x - cx) * (x - cx) + (y - cy) * (y - cy) <= r * r;
  };
  // Where Emmett's middle may go (just inside the membrane), how big he is, how far we zoom, where he starts.
  const SWIM = {
    animal: { inside: (x, y) => ((x - 400) / 326) ** 2 + ((y - 300) / 234) ** 2 <= 1, size: 0.65, zoom: 2, start: [250, 250] },
    plant: { inside: (x, y) => inRR(x, y, 102, 86, 698, 514, 20), size: 0.65, zoom: 2, start: [124, 290] },
    prokaryote: { inside: (x, y) => inRR(x, y, 224, 209, 696, 391, 91), size: 0.5, zoom: 2.3, start: [300, 300] },
  };
  const swim = { x: 0, y: 0, vx: 0, vy: 0, face: 1, ang: 0, cell: null, raf: 0, last: 0, frame: 0, cur: null, since: 0, fired: false, bubbleT: 0, pointer: null, bumpT: 0 };
  const NS = 'http://www.w3.org/2000/svg';
  function swimLayerMarkup() {
    return `<g id="swim-bubbles" pointer-events="none"></g><g id="swim-me" pointer-events="none">${swimmerMarkup()}</g>`;
  }
  function initSwim() {
    const S = SWIM[state.cell];
    if (swim.cell !== state.cell) {
      swim.cell = state.cell;
      swim.x = S.start[0]; swim.y = S.start[1]; swim.vx = swim.vy = 0; swim.face = 1; swim.ang = 0;
    }
    swim.cur = null; swim.fired = false; swim.pointer = null; swim.armed = false;
    renderSwim();
    if (!swim.raf) { swim.last = 0; swim.raf = requestAnimationFrame(swimLoop); }
  }
  function swimWelcome(entered) {
    const c = CELLS[state.cell];
    const names = (entered || []).map(id => `<b>${esc(info(id).name)}</b>`);
    const list = names.length > 1 ? names.slice(0, -1).join(', ') + ' and ' + names[names.length - 1] : names[0];
    setBubble(`<span class="kind-tag">${c.kind}</span>` +
      (names.length ? `<p>On your way in you discovered the ${list}! Tap a sticker under <b>Parts discovered</b> to hear about it again.</p>` : '') +
      `<p>You’re swimming inside the <b>${c.name}</b>! Swim up to any part and I’ll tell you all about it.</p>` +
      `<p style="opacity:.7;font-size:.9rem">Swim with the <b>arrow keys</b> (or WASD), or press and hold where you want to go.</p>`);
  }
  function svgPoint(x, y, toScreen) {
    const m = svg.getScreenCTM();
    if (!m) return null;
    const p = svg.createSVGPoint(); p.x = x; p.y = y;
    return p.matrixTransform(toScreen ? m : m.inverse());
  }
  function partAt(x, y) {
    const sp = svgPoint(x, y, true);
    if (!sp) return null;
    const r = svg.getBoundingClientRect();
    if (sp.x < r.left || sp.x > r.right || sp.y < r.top || sp.y > r.bottom) return null;
    const el = document.elementFromPoint(sp.x, sp.y);
    if (!el || !svg.contains(el)) return null;
    const p = el.closest('.part');
    return p ? p.dataset.part : null;
  }
  function toast(id, isNew) {
    const t = $('swim-toast');
    t.innerHTML = esc(info(id).name) + (isNew ? '<span class="new-badge">NEW!</span>' : '');
    t.classList.add('on');
    clearTimeout(toast.t);
    toast.t = setTimeout(() => t.classList.remove('on'), 1800);
  }
  function swimTouch(id) {
    const isNew = !state.found[state.cell].has(id);
    // drifting through open jelly shouldn't keep re-explaining the cytoplasm
    if (!isNew && (id === 'cytoplasm' || id === state.selected)) return;
    exploreTap(id);
    toast(id, isNew);
    const p = info(id);
    speak('Professor Goo', (isNew ? 'Ooh, you found the ' : 'That’s the ') + p.name + '! ' + p.job);
  }
  function renderSwim() {
    const S = SWIM[state.cell];
    const me = svg.querySelector('#swim-me');
    if (me) me.setAttribute('transform', `translate(${swim.x.toFixed(1)} ${swim.y.toFixed(1)}) scale(${(S.size * swim.face).toFixed(2)} ${S.size}) rotate(${swim.ang.toFixed(1)})`);
    const w = 800 / S.zoom, h = 600 / S.zoom;
    const vx = clamp(swim.x - w / 2, -30, 830 - w), vy = clamp(swim.y - h / 2, -30, 630 - h);
    svg.setAttribute('viewBox', `${vx.toFixed(1)} ${vy.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}`);
  }
  function swimLoop(ts) {
    if (!swimming()) { swim.raf = 0; return; }
    const dt = Math.min(0.05, (ts - (swim.last || ts)) / 1000);
    swim.last = ts;
    const S = SWIM[state.cell];
    let dx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0), dy = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
    if (!dx && !dy && swim.pointer) {
      const t = svgPoint(swim.pointer[0], swim.pointer[1]);
      if (t) { const ddx = t.x - swim.x, ddy = t.y - swim.y, d = Math.hypot(ddx, ddy); if (d > 6) { dx = ddx / d; dy = ddy / d; } }
    }
    const dl = Math.hypot(dx, dy);
    if (dl) { dx /= dl; dy /= dl; }
    const ACC = 700, MAX = 170;
    swim.vx += dx * ACC * dt; swim.vy += dy * ACC * dt;
    const drag = Math.exp(-2.8 * dt);
    swim.vx *= drag; swim.vy *= drag;
    const sp = Math.hypot(swim.vx, swim.vy);
    if (sp > MAX) { swim.vx *= MAX / sp; swim.vy *= MAX / sp; }
    // move, sliding along the membrane when we bump it
    const nx = swim.x + swim.vx * dt, ny = swim.y + swim.vy * dt;
    let bumped = false;
    if (S.inside(nx, ny)) { swim.x = nx; swim.y = ny; }
    else if (S.inside(nx, swim.y)) { swim.x = nx; swim.vy *= 0.3; bumped = true; }
    else if (S.inside(swim.x, ny)) { swim.y = ny; swim.vx *= 0.3; bumped = true; }
    else { swim.vx *= -0.3; swim.vy *= -0.3; bumped = true; }
    swim.bumpT -= dt;
    if (bumped && sp > 90 && swim.bumpT <= 0) { swim.bumpT = 0.4; tone(160, 0.12, 'sine', 0.08, 0, 260); }
    if (Math.abs(swim.vx) > 8) swim.face = swim.vx > 0 ? 1 : -1;
    const target = sp > 15 ? clamp(Math.atan2(swim.vy, Math.abs(swim.vx)) * 180 / Math.PI, -40, 40) : 0;
    swim.ang += (target - swim.ang) * Math.min(1, dt * 6);
    // bubbles trail
    swim.bubbleT -= dt;
    if (sp > 40 && swim.bubbleT <= 0) {
      swim.bubbleT = 0.16;
      const g = svg.querySelector('#swim-bubbles');
      if (g) {
        const c = document.createElementNS(NS, 'circle');
        c.setAttribute('cx', (swim.x - swim.face * 22 * S.size * 2 + rnd(-3, 3)).toFixed(1));
        c.setAttribute('cy', (swim.y + rnd(-4, 4)).toFixed(1));
        c.setAttribute('r', rnd(1.8, 3.6).toFixed(1));
        c.setAttribute('fill', '#fff'); c.setAttribute('fill-opacity', '.75'); c.setAttribute('stroke', INK); c.setAttribute('stroke-width', '1');
        c.setAttribute('class', 'bubl');
        g.appendChild(c); setTimeout(() => c.remove(), 1150);
      }
    }
    renderSwim();
    // what is Emmett's helmet touching?
    if (sp > 30) swim.armed = true; // don't interrupt the welcome until Emmett starts swimming
    if (swim.armed && ++swim.frame % 3 === 0) {
      const a = swim.ang * Math.PI / 180, reach = 40 * S.size;
      const id = partAt(swim.x + swim.face * Math.cos(a) * reach, swim.y + Math.sin(a) * reach);
      if (id !== swim.cur) { swim.cur = id; swim.since = ts; swim.fired = false; }
      else if (id && !swim.fired && ts - swim.since > 120) { swim.fired = true; swimTouch(id); }
    }
    swim.raf = requestAnimationFrame(swimLoop);
  }
  svg.addEventListener('pointerdown', e => {
    if (state.mode !== 'swim') return;
    e.preventDefault();
    swim.pointer = [e.clientX, e.clientY];
    try { svg.setPointerCapture(e.pointerId); } catch (er) {}
  });
  svg.addEventListener('pointermove', e => { if (swim.pointer) swim.pointer = [e.clientX, e.clientY]; });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => svg.addEventListener(n, () => { swim.pointer = null; }));

  resetScene();

  renderTitle();
  // allow deep links like /cells/#plant
  const h = location.hash.replace('#', '');
  if (h === 'prokaryotic' || h === 'bacteria') startGame('prokaryote');
  else if (Object.prototype.hasOwnProperty.call(CELLS, h)) startGame(h);
  else if (h === 'eukaryotic') { showScreen('title'); setPickStep('eu'); }
})();
</script>
</body>
</html>
