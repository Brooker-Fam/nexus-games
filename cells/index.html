<!DOCTYPE html>
<!-- Exploring Cells - Kitty Games educational game -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exploring Cells · Kitty Games</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script>
  if(location.protocol!=='file:'){
    const l=document.createElement('link');
    l.rel='stylesheet';
    l.href='https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap';
    document.head.appendChild(l);
  }
</script>
<style>
  :root {
    --ink: #2b1640;
    --sky: #bfeaff;
    --paper: #fffdf5;
    --pink: #ff8fb8;
    --yellow: #ffd23f;
    --green: #8be36b;
    --purple: #a77bff;
    --coral: #ff6a3d;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { min-height: 100%; }
  body {
    font-family: 'Baloo 2', 'Comic Sans MS', system-ui, sans-serif;
    color: var(--ink);
    background-color: var(--sky);
    background-image:
      radial-gradient(circle, rgba(255,255,255,0.7) 3px, transparent 4px),
      radial-gradient(circle, rgba(255,255,255,0.4) 2px, transparent 3px);
    background-size: 46px 46px, 46px 46px;
    background-position: 0 0, 23px 23px;
    overflow-x: hidden;
  }
  button { font-family: inherit; color: inherit; }

  /* ---------- cartoon buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 8px 18px;
    font-size: 1rem; font-weight: 800; letter-spacing: 0.02em;
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 16px;
    box-shadow: 0 5px 0 var(--ink);
    cursor: pointer;
    text-decoration: none;
    color: var(--ink);
    transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.15s ease;
    user-select: none;
  }
  .btn:hover { background: #fff7d6; }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
  .btn.primary { background: var(--yellow); }
  .btn.primary:hover { background: #ffe066; }
  .btn:focus-visible { outline: 4px solid var(--coral); outline-offset: 3px; }

  /* ---------- top bar ---------- */
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    max-width: 1180px; margin: 0 auto;
    padding: 14px 16px 0;
  }
  .topbar .btn { padding: 6px 14px; font-size: 0.9rem; }
  .icon-btn { width: 46px; padding: 6px !important; }
  .icon-btn svg { width: 24px; height: 24px; }

  .screen { display: none; }
  .screen.active { display: block; }

  /* ---------- title screen ---------- */
  .title-wrap {
    max-width: 920px; margin: 0 auto;
    padding: 16px 16px 48px;
    text-align: center;
  }
  .title-mascot { width: 150px; height: 150px; margin: 4px auto 0; display: block; animation: mascot-bounce 2.4s ease-in-out infinite; }
  @keyframes mascot-bounce {
    0%,100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-10px) rotate(3deg); }
  }
  .big-title {
    font-size: clamp(2.4rem, 8vw, 4.4rem);
    font-weight: 800;
    line-height: 1;
    color: #fff;
    -webkit-text-stroke: 8px var(--ink);
    paint-order: stroke fill;
    text-shadow: 0 7px 0 var(--ink);
    letter-spacing: 0.02em;
  }
  .big-title .t1 { color: var(--yellow); }
  .big-title .t2 { color: var(--pink); }
  .intro-bubble {
    position: relative;
    display: inline-block;
    max-width: 560px;
    margin: 26px auto 0;
    padding: 14px 22px;
    font-size: 1.1rem; font-weight: 600; line-height: 1.35;
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 22px;
    box-shadow: 0 5px 0 var(--ink);
  }
  .intro-bubble::before {
    content: ''; position: absolute; left: 50%; top: -15px;
    width: 24px; height: 24px; margin-left: -12px;
    background: #fff;
    border-left: 3px solid var(--ink); border-top: 3px solid var(--ink);
    transform: rotate(45deg);
  }
  .pick-row {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px;
    margin-top: 32px;
  }
  .pick-card {
    display: flex; flex-direction: column; align-items: center;
    padding: 14px 14px 18px;
    background: var(--paper);
    border: 4px solid var(--ink);
    border-radius: 28px;
    box-shadow: 0 8px 0 var(--ink);
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .pick-card:hover { transform: translateY(-5px) rotate(-1deg); box-shadow: 0 13px 0 var(--ink); }
  .pick-card:nth-child(2):hover { transform: translateY(-5px) rotate(1deg); }
  .pick-card:active { transform: translateY(4px); box-shadow: 0 4px 0 var(--ink); }
  .pick-card:focus-visible { outline: 4px solid var(--coral); outline-offset: 4px; }
  .pick-card svg { width: 100%; height: auto; pointer-events: none; }
  .pick-name { margin-top: 6px; font-size: 1.6rem; font-weight: 800; }
  .pick-sub { font-size: 0.95rem; font-weight: 600; opacity: 0.7; }
  [hidden] { display: none !important; }
  .pick-progress { margin-top: 8px; font-size: 0.85rem; font-weight: 800; padding: 2px 12px; border-radius: 999px; background: #fff; border: 2px solid var(--ink); }

  /* ---------- game screen ---------- */
  .game-wrap { max-width: 1180px; margin: 0 auto; padding: 14px 16px 40px; }
  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px;
    margin-bottom: 16px;
  }
  .seg {
    display: inline-flex;
    border: 3px solid var(--ink);
    border-radius: 16px;
    background: #fff;
    box-shadow: 0 5px 0 var(--ink);
    overflow: hidden;
  }
  .seg button {
    padding: 7px 16px;
    font-size: 1rem; font-weight: 800;
    background: transparent;
    border: none;
    cursor: pointer;
  }
  .seg button + button { border-left: 3px solid var(--ink); }
  .seg button.on { background: var(--yellow); }
  .seg button:hover:not(.on) { background: #fff7d6; }
  .seg button:focus-visible { outline: 3px solid var(--coral); outline-offset: -5px; }
  .btn.toggle.on { background: var(--green); }
  .kind-tag { display: inline-block; margin-bottom: 4px; padding: 0 10px; font-size: 0.75rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; border: 2px solid var(--ink); border-radius: 999px; background: #e5f8ff; }

  .game-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
    gap: 22px;
    align-items: start;
  }
  .stage {
    position: relative;
    background-color: var(--paper);
    background-image: radial-gradient(circle, rgba(43,22,64,0.08) 2px, transparent 2.5px);
    background-size: 24px 24px;
    border: 4px solid var(--ink);
    border-radius: 30px;
    box-shadow: 0 9px 0 var(--ink);
    padding: 10px;
  }
  .quiz-banner {
    display: none;
    margin: 4px 4px 8px;
    padding: 10px 16px;
    font-size: 1.15rem; font-weight: 800; line-height: 1.25;
    text-align: center;
    background: var(--yellow);
    border: 3px solid var(--ink);
    border-radius: 18px;
  }
  .quiz-banner small { display: block; font-size: 0.8rem; opacity: 0.7; letter-spacing: 0.06em; text-transform: uppercase; }
  .stage.quiz .quiz-banner { display: block; }
  .quiz-banner .fb { display: block; font-size: 0.9rem; min-height: 0; }
  .quiz-banner .fb:empty { display: none; }
  .quiz-banner .fb.good { color: #1f7a1f; }
  .quiz-banner .fb.bad { color: #b3261e; }
  #cell { display: block; width: 100%; height: auto; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

  /* parts */
  .part { cursor: pointer; }
  .part:hover > .pos { filter: brightness(1.07); }
  .bob { animation: bob 3.2s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .fx { transform-box: fill-box; transform-origin: center; }
  .eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
  .part.selected > .pos, .part.correct > .pos {
    animation: glow 0.9s ease-in-out infinite alternate;
  }
  @keyframes glow {
    from { filter: drop-shadow(0 0 2px #fff36b) drop-shadow(0 0 4px #ffb800); }
    to   { filter: drop-shadow(0 0 7px #fff36b) drop-shadow(0 0 12px #ffb800); }
  }
  .part.correct > .pos { animation-name: glow-green; }
  @keyframes glow-green {
    from { filter: drop-shadow(0 0 3px #b6ff7a) drop-shadow(0 0 6px #3ccf3c); }
    to   { filter: drop-shadow(0 0 9px #b6ff7a) drop-shadow(0 0 14px #3ccf3c); }
  }
  .part.hint > .pos { animation: glow 0.45s ease-in-out infinite alternate; }
  .part.wrong .fx { animation: shake 0.45s ease; }
  @keyframes shake {
    0%,100% { transform: translateX(0) rotate(0); }
    20% { transform: translateX(-6px) rotate(-4deg); }
    40% { transform: translateX(6px) rotate(4deg); }
    60% { transform: translateX(-4px) rotate(-2deg); }
    80% { transform: translateX(4px) rotate(2deg); }
  }
  .part.selected .fx, .part.correct .fx { animation: boing 0.5s ease; }
  @keyframes boing {
    0% { transform: scale(1); } 30% { transform: scale(1.12, 0.9); } 55% { transform: scale(0.95, 1.06); } 100% { transform: scale(1); }
  }
  .part.big.selected .fx, .part.big.correct .fx { animation: none; }
  .floaty { animation: drift 7s ease-in-out infinite; }
  @keyframes drift { 0%,100% { transform: translate(0,0); } 33% { transform: translate(6px,-5px); } 66% { transform: translate(-5px,4px); } }
  #labels { display: none; }
  #cell.show-labels #labels { display: inline; }
  #labels text { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 15px; fill: var(--ink); }

  /* side panel */
  .side { display: flex; flex-direction: column; gap: 18px; }
  .guide { display: flex; flex-direction: column; }
  .guide-head { display: flex; align-items: flex-end; gap: 8px; margin-left: 6px; }
  .guide-head svg { width: 76px; height: 76px; flex: none; }
  .guide-name { font-weight: 800; font-size: 1.05rem; margin-bottom: 14px; }
  .bubble {
    position: relative;
    margin-top: 10px;
    padding: 16px 18px;
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 22px;
    box-shadow: 0 6px 0 var(--ink);
    font-size: 1rem; font-weight: 600; line-height: 1.4;
    min-height: 120px;
  }
  .bubble::before {
    content: ''; position: absolute; left: 34px; top: -14px;
    width: 22px; height: 22px;
    background: #fff;
    border-left: 3px solid var(--ink); border-top: 3px solid var(--ink);
    transform: rotate(45deg);
  }
  .bubble.pop { animation: bubble-pop 0.3s ease; }
  @keyframes bubble-pop { 0% { transform: scale(0.94); } 60% { transform: scale(1.03); } 100% { transform: scale(1); } }
  .part-title {
    display: flex; align-items: center; gap: 10px;
    font-size: 1.45rem; font-weight: 800; line-height: 1.1;
    margin-bottom: 4px;
  }
  .swatch { width: 22px; height: 22px; flex: none; border-radius: 50%; border: 3px solid var(--ink); }
  .new-badge {
    font-size: 0.7rem; font-weight: 800; letter-spacing: 0.08em;
    padding: 1px 8px; border-radius: 999px;
    background: var(--coral); color: #fff; border: 2px solid var(--ink);
  }
  .fullname { font-size: 0.85rem; opacity: 0.65; margin-bottom: 6px; }
  .info-row { margin-top: 10px; padding: 8px 12px; border-radius: 14px; background: #f3f0ff; }
  .info-row b { display: block; font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; }
  .info-row.like { background: #e5f8ff; }
  .info-row.fact { background: #fff4cc; }
  .bubble .btn { margin-top: 12px; }
  .bubble p + p { margin-top: 8px; }

  .progress-card {
    padding: 14px 16px 16px;
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 22px;
    box-shadow: 0 6px 0 var(--ink);
  }
  .progress-head { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 1.05rem; }
  .meter { margin-top: 8px; height: 16px; border: 3px solid var(--ink); border-radius: 999px; background: #fff; overflow: hidden; }
  .meter > div { height: 100%; width: 0; background: repeating-linear-gradient(45deg, #6fdc5a 0 10px, #8be36b 10px 20px); transition: width 0.4s ease; }
  .stickers { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .sticker {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px 3px 4px;
    font-size: 0.85rem; font-weight: 800;
    background: #fff;
    border: 2px solid var(--ink);
    border-radius: 999px;
    cursor: pointer;
  }
  .sticker .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--ink); background: #ddd; }
  .sticker.locked { opacity: 0.55; }
  .sticker.locked .dot { background: repeating-linear-gradient(45deg, #ccc 0 3px, #eee 3px 6px); }
  .sticker.current { background: #fff36b; }
  .sticker:focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; }
  .star-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
  .star-row svg { width: 30px; height: 30px; }
  .big-stars { display: flex; justify-content: center; flex-wrap: wrap; gap: 2px; margin: 8px 0; }
  .big-stars svg { width: 34px; height: 34px; }

  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }


  /* ---------- intro cinematic ---------- */
  .intro-wrap { max-width: 980px; margin: 0 auto; padding: 14px 16px 40px; }
  .cine {
    position: relative;
    border: 4px solid var(--ink);
    border-radius: 26px;
    box-shadow: 0 9px 0 var(--ink);
    overflow: hidden;
    background: #ffe7b3;
    cursor: pointer;
  }
  #scene { display: block; width: 100%; height: auto; }
  #cam { transition: transform 1.3s cubic-bezier(.6,0,.3,1); }
  .cine-start {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background: rgba(43,22,64,0.55);
    cursor: default;
    text-align: center;
    padding: 16px;
  }
  .cine-start.hidden { display: none; }
  .cine-kicker { color: #fff; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; font-size: 0.95rem; }
  .cine-title {
    font-size: clamp(2rem, 7vw, 3.6rem); font-weight: 800; line-height: 1;
    color: var(--yellow);
    -webkit-text-stroke: 7px var(--ink); paint-order: stroke fill;
    text-shadow: 0 6px 0 var(--ink);
    margin-bottom: 8px;
  }
  .btn.big { font-size: 1.25rem; padding: 10px 26px; }
  .cine-skip {
    position: absolute; top: 12px; right: 12px;
    padding: 4px 14px; font-size: 0.9rem;
    display: none;
  }
  .cine.playing .cine-skip { display: inline-flex; }
  .subs {
    position: relative;
    margin-top: 18px;
    min-height: 92px;
    padding: 14px 18px 12px;
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 20px;
    box-shadow: 0 6px 0 var(--ink);
    font-size: 1.2rem; font-weight: 700; line-height: 1.35;
    visibility: hidden;
  }
  .subs.on { visibility: visible; }
  .subs .speaker {
    display: inline-block;
    margin-right: 8px;
    padding: 0 12px;
    border: 3px solid var(--ink);
    border-radius: 999px;
    font-weight: 800; font-size: 0.95rem;
    vertical-align: 2px;
  }
  .subs-hint { position: absolute; right: 14px; bottom: 4px; font-size: 0.75rem; opacity: 0.45; font-weight: 700; }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 60; transition: opacity 0.6s ease; }
  #flash.on { opacity: 1; }
  .title-actions { margin-top: 22px; }

  /* scene animation */
  .kid .hop, .kid-hands .hop { transform-box: fill-box; transform-origin: bottom center; }
  .kid.cheer .hop, .kid-hands.cheer .hop { animation: cheer 0.45s ease-in-out infinite alternate; }
  @keyframes cheer { from { transform: translateY(0); } to { transform: translateY(-12px); } }
  .m-o { display: none; }
  .kid.gasp .m-o, .kid.wow .m-o { display: inline; }
  .kid.gasp .m-smile, .kid.wow .m-smile { display: none; }
  .yay { opacity: 0; transform-box: fill-box; transform-origin: center bottom; transform: scale(0.3); transition: opacity 0.2s ease, transform 0.25s cubic-bezier(.3,1.6,.5,1); }
  .yay.on { opacity: 1; transform: scale(1); }
  .t-talk { display: none; }
  .teacher.talking .t-talk { display: inline; }
  .teacher.talking .t-smile { display: none; }
  .t-talk { transform-box: fill-box; transform-origin: center; animation: talk 0.22s ease-in-out infinite alternate; }
  @keyframes talk { from { transform: scaleY(0.35); } to { transform: scaleY(1); } }
  .arm-up { display: none; }
  .teacher.holding .arm-up { display: inline; }
  .teacher.holding .arm-down { display: none; }
  .board-part { opacity: 0; transition: opacity 0.6s ease; }
  .board-part.on { opacity: 1; }
  #mach-pos { transition: transform 0.9s ease-in-out, opacity 0.3s ease; opacity: 0; }
  #mach-pos.on { opacity: 1; }
  #mach-hop.hop { animation: mach-hop 0.9s ease-in-out; }
  @keyframes mach-hop { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-46px); } }
  #mach-shake { transform-box: fill-box; transform-origin: center; }
  .machine.active #mach-shake { animation: mach-shake 0.08s linear infinite; }
  @keyframes mach-shake { 0% { transform: translate(-1.5px, 0) rotate(-2deg); } 50% { transform: translate(1.5px, -1px) rotate(2deg); } 100% { transform: translate(-1px, 1px) rotate(-1deg); } }
  .mlight { animation: mlight 1.2s steps(2) infinite; }
  .machine.active .mlight { animation-duration: 0.15s; }
  @keyframes mlight { 0% { fill: #6bff8a; } 50% { fill: #1f8a3a; } }
  .machine.active .mscreen { animation: mscreen 0.3s linear infinite; }
  @keyframes mscreen { 0% { fill: #ff3bd5; } 33% { fill: #3bd5ff; } 66% { fill: #ffe53b; } }
  .machine.pressed .mbtn { transform-box: fill-box; transform-origin: bottom center; transform: scaleY(0.6); filter: drop-shadow(0 0 6px #ff3b3b); }
  #leo-hand { transition: none; }
  #leo-hand.press { animation: press 0.7s ease-in-out forwards; }
  @keyframes press {
    0% { transform: translate(0, 0); }
    55% { transform: translate(-8px, -78px); }
    80% { transform: translate(-8px, -60px); }
    100% { transform: translate(-8px, -62px); }
  }
  .leo-spin { transform-box: view-box; transform-origin: 690px 290px; }
  .leo-spin.swept { animation: swept 1.7s cubic-bezier(.5,0,.8,.4) forwards; }
  @keyframes swept {
    0% { transform: translate(0, 0) rotate(0) scale(1); }
    25% { transform: translate(0, -10px) rotate(-30deg) scale(1.05); }
    100% { transform: translate(0, 24px) rotate(1080deg) scale(0); }
  }
  #vortex { opacity: 0; transition: opacity 0.4s ease; }
  #vortex.on { opacity: 1; }
  #vortex .ring { transform-box: fill-box; transform-origin: center; animation: spin 1s linear infinite; }
  #vortex .ring.r2 { animation-duration: 0.7s; animation-direction: reverse; }
  #vortex .ring.r3 { animation-duration: 1.4s; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #vortex-grow { transform-box: fill-box; transform-origin: center; transform: scale(0.1); transition: transform 1.2s ease-out; }
  #vortex.on #vortex-grow { transform: scale(1); }
  #vortex.off #vortex-grow { transform: scale(0); transition-duration: 0.6s; }

  @media (max-width: 900px) {
    .game-grid { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 560px) {
    .pick-row { grid-template-columns: minmax(0, 1fr); gap: 18px; }
    .seg button { padding: 6px 11px; font-size: 0.9rem; }
    .btn { padding: 6px 12px; font-size: 0.9rem; }
    .stage { padding: 6px; border-radius: 22px; }
    .quiz-banner { font-size: 1rem; }
    .topbar .crumb { display: none; }
    .subs { font-size: 1rem; min-height: 80px; }
    .cine-start { gap: 8px; }
    .btn.big { font-size: 1.05rem; padding: 8px 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .bob, .eyes, .floaty, .title-mascot, .part .fx { animation: none !important; }
  }
</style>
</head>
<body>
<header class="topbar">
  <a class="btn" href="/">&larr; <span class="crumb">Kitty Games</span></a>
  <button class="btn icon-btn" id="sound-btn" aria-label="Turn sound off" title="Sound"></button>
</header>

<!-- ============ TITLE SCREEN ============ -->
<section class="screen active" id="screen-intro">
  <div class="intro-wrap">
    <div class="cine" id="cine">
      <svg id="scene" viewBox="0 0 800 450" role="img" aria-label="Cartoon classroom: Ms. Rivera's science class"></svg>
      <div class="cine-start" id="cine-start">
        <div class="cine-kicker">Exploring Cells &middot; Chapter 1</div>
        <div class="cine-title">The Field Trip</div>
        <button class="btn primary big" id="cine-play">&#9654; Play the story</button>
        <button class="btn" id="cine-skip0">Skip to the game</button>
      </div>
      <button class="btn cine-skip" id="cine-skip">Skip &#9656;&#9656;</button>
    </div>
    <div class="subs" id="subs" aria-live="polite"></div>
  </div>
</section>

<section class="screen" id="screen-title">
  <div class="title-wrap">
    <svg class="title-mascot" id="title-mascot" viewBox="0 0 120 120" aria-hidden="true"></svg>

<script>
(function(){
  'use strict';

  // ================= colors =================
  const INK = '#2b1640';
  const C = {
    membraneA: '#ff8fb8', cytoA: '#ffe9f2', cytoAdot: '#ff9fc4',
    nucleus: '#a77bff', nucleusRing: '#c9adff', chromatin: '#8455ee', nucleolus: '#6b3fd1',
    mito: '#ff9f43', mitoIn: '#ffd9ab', cristae: '#e8731c',
    ribo: '#3d2c8d',
    rough: '#6cb8ff', smooth: '#3fd0b0', golgi: '#ffd23f',
    lyso: '#ff6b6b', lysoDot: '#c93c4f',
    vac: '#9be7ff', centro: '#b8e04a', centroLine: '#6f9a12',
    wall: '#9bd56f', wallDark: '#5e9c3f',
    cytoP: '#effce0', cytoPdot: '#a5d98a', membraneP: '#ffcd4d',
    chloro: '#49c25a', chloroIn: '#8fe07f', grana: '#23863a',
    cvac: '#a9e4ff', cvacWave: '#62c3ee',
    capsule: '#fff1a8', bwall: '#7ed9a0', bwallDark: '#3f9c68', cytoB: '#e6f6ff', cytoBdot: '#8fc6ee',
    nucleoid: '#a77bff', plasmid: '#ff6b9a', flagellum: '#6cb8ff', pili: '#ffb35c',
  };

  // ================= the parts =================
  const PARTS = {
    membrane: {
      name: 'Cell Membrane', color: C.membraneA,
      job: 'A thin, bendy skin around the cell. It decides what gets in (like food and water) and what goes out (like waste).',
      like: 'A security guard at the door, checking who comes in and out.',
      fact: 'It’s made of fatty molecules lined up in two rows, tail-to-tail, like a double row of tiny lollipops!',
      clues: ['Tap the part that controls what goes in and out of the cell!', 'Find the thin, bendy skin that wraps around the cell!'],
    },
    cytoplasm: {
      name: 'Cytoplasm', color: '#ffc2da',
      job: 'The squishy jelly that fills the cell. All the other parts float in it, and lots of the cell’s chemistry happens here.',
      like: 'The streets and parks of a city, where everyone gets around.',
      fact: 'Cytoplasm is mostly water, which is why cells are so squishy!',
      clues: ['Tap the jelly that all the cell parts float in!', 'Find the squishy, watery stuff that fills the cell!'],
    },
    nucleus: {
      name: 'Nucleus', color: C.nucleus,
      job: 'The control center! It holds the DNA, the instruction book that tells the cell how to grow, work and make copies of itself.',
      like: 'The mayor’s office, or the cell’s brain.',
      fact: 'If you stretched out all the DNA from just one of your cells, it would be about 2 meters long, taller than a grown-up!',
      clues: ['Tap the control center that holds the DNA!', 'Where does the cell keep its instruction book?'],
    },
    mitochondria: {
      name: 'Mitochondria', color: C.mito,
      job: 'The powerhouses! They turn food (sugar) and oxygen into energy the cell can use.',
      like: 'A power plant that keeps all the lights on.',
      fact: 'Mitochondria have their own tiny bit of DNA, and you got all of yours from your mom!',
      clues: ['Tap the powerhouse that makes energy for the cell!', 'Which part turns food into energy?'],
    },
    ribosome: {
      name: 'Ribosomes', color: C.ribo,
      job: 'Tiny builders that read instructions from the DNA and use them to put together proteins.',
      like: 'Workers in a factory, snapping parts together.',
      fact: 'One cell can have millions of ribosomes! They’re the little dots floating around.',
      clues: ['Tap one of the tiny floating dots that build proteins!', 'Find a little protein builder floating in the jelly!'],
    },
    roughER: {
      name: 'Rough ER', full: 'Rough Endoplasmic Reticulum', color: C.rough,
      job: 'Folded tubes covered in ribosomes. Proteins get built here and then sent off to be packed up.',
      like: 'A factory assembly line.',
      fact: 'It looks bumpy, or “rough”, because ribosomes are stuck all over it!',
      clues: ['Tap the bumpy tubes covered in ribosomes!', 'Find the folded tubes with dots all over them, wrapped near the nucleus!'],
    },
    smoothER: {
      name: 'Smooth ER', full: 'Smooth Endoplasmic Reticulum', color: C.smooth,
      job: 'Wiggly tubes with no ribosomes. They make fats and help clean harmful stuff out of the cell.',
      like: 'A workshop that makes oils and cleaning supplies.',
      fact: 'Your liver cells are packed with smooth ER to help break down things that could hurt you.',
      clues: ['Tap the smooth, wiggly tubes that make fats!', 'Find the tubes that have NO bumps on them!'],
    },
    golgi: {
      name: 'Golgi Apparatus', color: C.golgi,
      job: 'Packs proteins into little bubbles called vesicles and ships them to where they need to go.',
      like: 'The post office of the cell.',
      fact: 'It’s named after Camillo Golgi, an Italian scientist who discovered it in 1898.',
      clues: ['Tap the cell’s post office that packs and ships proteins!', 'Find the stack of curvy pancakes that wraps up packages!'],
    },
    lysosome: {
      name: 'Lysosomes', color: C.lyso,
      job: 'Little bubbles full of digestive juices. They break down waste and worn-out cell parts.',
      like: 'The recycling and clean-up crew.',
      fact: 'Lysosomes are acidic inside, which helps their special enzymes chop things into tiny pieces.',
      clues: ['Tap the clean-up crew that breaks down waste!', 'Which little bubble recycles old cell parts?'],
    },
    vacuole: {
      name: 'Vacuole', color: C.vac,
      job: 'A small storage bubble that holds water, food or waste until the cell needs it.',
      like: 'A storage closet.',
      fact: 'Animal cells have small vacuoles, but plant cells have one GIANT one!',
      clues: ['Tap the small storage bubble!', 'Where does an animal cell keep extra water and food?'],
    },
    centrosome: {
      name: 'Centrosome', color: C.centro,
      job: 'Helps the cell split in two by organizing fibers that pull the copied DNA apart.',
      like: 'A coach directing the team during a big play.',
      fact: 'It has two tiny tube bundles called centrioles that sit at right angles to each other.',
      clues: ['Tap the part that helps the cell split in two!', 'Find the two little striped tubes sitting at right angles!'],
    },
    wall: {
      name: 'Cell Wall', color: C.wall,
      job: 'A tough, stiff layer outside the membrane. It protects the plant cell and keeps its boxy shape.',
      like: 'The strong walls of a castle.',
      fact: 'Cell walls are made of cellulose, the same stuff that paper and cotton are made of!',
      clues: ['Tap the tough outer wall that protects the plant cell!', 'Which stiff layer gives a plant cell its boxy shape?'],
    },
    chloroplast: {
      name: 'Chloroplasts', color: C.chloro,
      job: 'They use sunlight, water and air (carbon dioxide) to make sugar for food. This is called photosynthesis!',
      like: 'Solar panels that cook lunch.',
      fact: 'They’re green because of chlorophyll, and that’s why leaves are green too!',
      clues: ['Tap the part that uses sunlight to make food!', 'Where does photosynthesis happen?'],
    },
    centralVacuole: {
      name: 'Central Vacuole', color: C.cvac,
      job: 'A huge water balloon. It stores water and pushes against the wall to keep the plant firm.',
      like: 'A water tower for the whole cell.',
      fact: 'When a plant doesn’t get enough water, its vacuoles shrink. That’s why it wilts and droops!',
      clues: ['Tap the giant water balloon of the plant cell!', 'Which part keeps a plant from wilting?'],
    },
    capsule: {
      name: 'Capsule', color: C.capsule,
      job: 'A slimy, sticky coat around the outside of the bacterium. It helps it stick to things and hide from your body’s germ fighters.',
      like: 'A slippery raincoat.',
      fact: 'Capsules help some bacteria stick to your teeth. That’s part of how plaque forms, so keep brushing!',
      clues: ['Tap the slimy coat on the very outside of the bacterium!', 'Find the sticky layer that helps bacteria hide and hold on!'],
    },
    nucleoid: {
      name: 'Nucleoid', color: C.nucleoid,
      job: 'The area where the bacterium keeps its DNA. There’s no nucleus around it, so the DNA just floats in a big tangled loop!',
      like: 'Instruction pages piled on an open desk instead of locked in an office.',
      fact: 'Having NO nucleus is exactly what makes a cell prokaryotic. “Pro-karyotic” means “before the nucleus”!',
      clues: ['Tap the tangled DNA that floats with no nucleus around it!', 'Where does a bacterium keep its main instruction book?'],
    },
    plasmid: {
      name: 'Plasmids', color: C.plasmid,
      job: 'Tiny extra rings of DNA with bonus instructions, like how to survive certain medicines.',
      like: 'Trading cards with special powers.',
      fact: 'Bacteria can pass plasmids to their neighbors, sharing new tricks with each other!',
      clues: ['Tap one of the tiny extra rings of DNA!', 'Find the little bonus DNA loops that bacteria can share!'],
    },
    flagellum: {
      name: 'Flagellum', color: C.flagellum,
      job: 'A long, whip-like tail that spins like a propeller to push the bacterium through water.',
      like: 'The motor on the back of a speedboat.',
      fact: 'Some flagella can spin more than 100 times every second!',
      clues: ['Tap the long tail that spins to make the bacterium swim!', 'Which part works like a propeller?'],
    },
    pili: {
      name: 'Pili', color: C.pili,
      job: 'Short, hair-like threads all over the outside. They help the bacterium grab onto surfaces and other cells.',
      like: 'Velcro hooks.',
      fact: 'Just one is called a pilus. Some bacteria use pili like grappling hooks to pull themselves along!',
      clues: ['Tap the short little hairs that stick out all around!', 'Find the tiny threads that help bacteria grab on to things!'],
    },
  };

  // Some parts work a bit differently depending on the cell.
  const OVERRIDES = {
    prokaryote: {
      wall: {
        color: C.bwall,
        job: 'A tough layer just outside the membrane. It gives the bacterium its shape and keeps it from bursting.',
        like: 'A suit of armor.',
        fact: 'Bacteria walls are made of something called peptidoglycan, not cellulose like plants. The medicine penicillin works by breaking it!',
        clues: ['Tap the tough layer that keeps the bacterium from bursting!', 'Find the strong layer between the slimy coat and the membrane!'],
      },
      ribosome: {
        fact: 'Bacteria ribosomes are a bit smaller than yours, so some medicines can jam them without hurting your own cells!',
      },
      cytoplasm: {
        color: '#bfe4ff',
        job: 'The watery jelly inside the bacterium. The DNA, ribosomes and plasmids all float around in it.',
      },
    },
  };
  function info(id, cell) {
    return Object.assign({}, PARTS[id], (OVERRIDES[cell || state.cell] || {})[id] || {});
  }

  // ================= drawing helpers =================
  const fmt = p => p[0].toFixed(1) + ' ' + p[1].toFixed(1);
  const rnd = (a, b) => a + Math.random() * (b - a);

  function smoothPath(pts, closed) {
    const n = pts.length;
    const get = i => closed ? pts[(i + n) % n] : pts[Math.max(0, Math.min(n - 1, i))];
    let d = 'M' + fmt(pts[0]);
    const last = closed ? n : n - 1;
    for (let i = 0; i < last; i++) {
      const p0 = get(i - 1), p1 = get(i), p2 = get(i + 1), p3 = get(i + 2);
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
      const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      d += ' C' + fmt(c1) + ' ' + fmt(c2) + ' ' + fmt(p2);
    }
    return d + (closed ? 'Z' : '');
  }
  function blob(cx, cy, rx, ry, n, amp, ph) {
    const pts = [];
    for (let i = 0; i < n; i++) {
      const a = i / n * Math.PI * 2;
      const k = 1 + amp * Math.sin(3 * a + ph) + amp * 0.6 * Math.sin(5 * a + ph * 2);
      pts.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]);
    }
    return smoothPath(pts, true);
  }
  function arcPts(cx, cy, r, a0, a1, wob, n) {
    n = n || 18;
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      const a = (a0 + (a1 - a0) * t) * Math.PI / 180;
      const rr = r + wob * Math.sin(t * Math.PI * 4);
      pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]);
    }
    return pts;
  }
  function face(x, y, s) {
    const d = rnd(0, 4.5).toFixed(2);
    return `<g transform="translate(${x} ${y}) scale(${s})">
      <ellipse cx="-16" cy="6" rx="4.5" ry="2.8" fill="#ff4f86" opacity=".45"/>
      <ellipse cx="16" cy="6" rx="4.5" ry="2.8" fill="#ff4f86" opacity=".45"/>
      <g class="eyes" style="animation-delay:-${d}s">
        <ellipse cx="-8.5" cy="-4" rx="6" ry="7.5" fill="#fff" stroke="${INK}" stroke-width="2.5"/>
        <ellipse cx="8.5" cy="-4" rx="6" ry="7.5" fill="#fff" stroke="${INK}" stroke-width="2.5"/>
        <circle cx="-7.5" cy="-2.5" r="3.5" fill="${INK}"/><circle cx="9.5" cy="-2.5" r="3.5" fill="${INK}"/>
        <circle cx="-6.2" cy="-4.2" r="1.4" fill="#fff"/><circle cx="10.8" cy="-4.2" r="1.4" fill="#fff"/>
      </g>
      <path d="M-6 6 Q0 13 6 6" fill="none" stroke="${INK}" stroke-width="2.6" stroke-linecap="round"/>
    </g>`;
  }
  function shine(cx, cy, rx, ry, rot) {
    return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#fff" opacity=".55" transform="rotate(${rot == null ? -30 : rot} ${cx} ${cy})"/>`;
  }
  function tube(d, color, w) {
    return `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w + 9}" stroke-linecap="round" stroke-linejoin="round"/>` +
      `<path d="${d}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>` +
      `<path d="${d}" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="${Math.max(2, w * 0.22).toFixed(1)}" stroke-linecap="round" transform="translate(-1 -2)"/>`;
  }
  function part(id, x, y, rot, scale, inner, opts) {
    opts = opts || {};
    let t = `translate(${x} ${y})`;
    if (rot) t += ` rotate(${rot})`;
    if (scale && scale !== 1) t += ` scale(${scale})`;
    const bob = opts.bob === false ? '' : 'bob';
    return `<g class="part${opts.big ? ' big' : ''}" data-part="${id}"><g class="pos" transform="${t}">` +
      `<g class="${bob}" style="animation-delay:-${rnd(0, 3.2).toFixed(2)}s"><g class="fx">${inner}</g></g></g></g>`;
  }
  function star(filled) {
    return `<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3 L25 14.5 L37.5 15.5 L28 24 L31 36.5 L20 30 L9 36.5 L12 24 L2.5 15.5 L15 14.5 Z" fill="${filled ? '#ffd23f' : '#e9e4f2'}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>${filled ? '<ellipse cx="16" cy="16" rx="4" ry="2.2" fill="#fff" opacity=".7" transform="rotate(-30 16 16)"/>' : ''}</svg>`;
  }

  // ---------- organelle shapes (drawn around 0,0) ----------
  const SHAPE = {
    nucleus() {
      return `<circle r="78" fill="${C.nucleus}" stroke="${INK}" stroke-width="6"/>
        <circle r="66" fill="none" stroke="${C.nucleusRing}" stroke-width="4" stroke-dasharray="1 12" stroke-linecap="round"/>
        <path d="M-56 -8 q8 -14 18 -4 t18 -2 M-48 14 q10 -8 16 2 M30 30 q10 -10 20 0 t14 -6 M14 52 q8 -8 18 0" fill="none" stroke="${C.chromatin}" stroke-width="3.5" stroke-linecap="round"/>
        ${shine(-34, -44, 20, 8, -35)}
        <circle cx="28" cy="-30" r="21" fill="${C.nucleolus}" stroke="${INK}" stroke-width="4"/>
        ${shine(21, -37, 6, 3, -35)}
        ${face(-6, 22, 1.35)}`;
    },
    mitochondria() {
      return `<rect x="-48" y="-24" width="96" height="48" rx="24" fill="${C.mito}" stroke="${INK}" stroke-width="5"/>
        <rect x="-38" y="-15" width="76" height="30" rx="15" fill="${C.mitoIn}"/>
        <path d="M-34 0 L-27 -11 L-19 11 L-11 -11 L-3 11 L5 -11 L13 11 L21 -11 L29 11 L34 0" fill="none" stroke="${C.cristae}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
        ${shine(-24, -16, 12, 3.5, -8)}
        ${face(0, 1, 0.68)}`;
    },
    ribosome() {
      return `<circle r="22" fill="transparent"/>
        <circle r="6.5" fill="${C.ribo}" stroke="${INK}" stroke-width="2"/>
        <circle cx="-2" cy="-2.2" r="1.9" fill="#fff" opacity=".75"/>`;
    },
    lysosome(r) {
      r = r || 22;
      const k = r / 22;
      return `<circle r="${r}" fill="${C.lyso}" stroke="${INK}" stroke-width="4.5"/>
        <circle cx="${-11 * k}" cy="${10 * k}" r="${2.4 * k}" fill="${C.lysoDot}"/>
        <circle cx="${12 * k}" cy="${12 * k}" r="${2 * k}" fill="${C.lysoDot}"/>
        <circle cx="${14 * k}" cy="${-8 * k}" r="${1.8 * k}" fill="${C.lysoDot}"/>
        ${shine(-8 * k, -11 * k, 6 * k, 3 * k)}
        ${face(0, 1 * k, 0.6 * k)}`;
    },
    vacuole() {
      return `<circle r="34" fill="${C.vac}" stroke="${INK}" stroke-width="5"/>
        <path d="M-20 18 q5 -4 10 0 t10 0 t10 0" fill="none" stroke="#5fc6e8" stroke-width="3" stroke-linecap="round"/>
        ${shine(-13, -16, 10, 4.5)}
        ${face(0, 0, 0.8)}`;
    },
    centrosome() {
      const cyl = (x, y, rot) => `<g transform="translate(${x} ${y}) rotate(${rot})">
          <rect x="-22" y="-9" width="44" height="18" rx="7" fill="${C.centro}" stroke="${INK}" stroke-width="4"/>
          <path d="M-11 -7V7M0 -7V7M11 -7V7" stroke="${C.centroLine}" stroke-width="3" stroke-linecap="round"/>
          <ellipse cx="-12" cy="-4" rx="6" ry="1.6" fill="#fff" opacity=".6"/>
        </g>`;
      return `<circle r="32" fill="transparent"/>${cyl(-8, -2, 0)}${cyl(12, 6, 90)}`;
    },
    golgi() {
      let s = '<circle cx="20" cy="0" r="58" fill="transparent"/>';
      [30, 46, 62, 78].forEach((r, i) => {
        const span = 62 - i * 8;
        s += tube(smoothPath(arcPts(60, 0, r, 180 - span, 180 + span, 0, 10)), C.golgi, 11);
      });
      [[-4, -62, 7], [20, -52, 5.5], [-2, 62, 6.5], [24, 50, 5], [64, -20, 5]].forEach(v => {
        s += `<circle cx="${v[0]}" cy="${v[1]}" r="${v[2]}" fill="${C.golgi}" stroke="${INK}" stroke-width="3"/>`;
      });
      return s;
    },
    smoothER() {
      const pts = [[-60, -28], [-30, -40], [0, -26], [30, -40], [58, -26], [72, -8], [55, 6], [25, -4], [-5, 8], [-35, -2], [-62, 10], [-72, 26], [-50, 40], [-20, 30], [10, 42], [40, 32], [64, 40]];
      return `<rect x="-82" y="-50" width="164" height="100" rx="30" fill="transparent"/>` + tube(smoothPath(pts), C.smooth, 12);
    },
    chloroplast() {
      const grana = x => [0, 1, 2].map(k => `<ellipse cx="${x}" cy="${-6 + k * 6}" rx="9" ry="3.6" fill="${C.grana}" stroke="${INK}" stroke-width="1.5"/>`).join('');
      return `<ellipse rx="54" ry="28" fill="${C.chloro}" stroke="${INK}" stroke-width="5"/>
        <ellipse rx="44" ry="19" fill="${C.chloroIn}"/>
        <path d="M-21 0 H-12 M12 0 H21" stroke="${C.grana}" stroke-width="2.5"/>
        ${grana(-31)}${grana(31)}
        ${shine(-20, -15, 12, 3.5, -8)}
        ${face(0, 1, 0.66)}`;
    },
    centralVacuole() {
      return `<rect x="-155" y="-140" width="310" height="280" rx="95" fill="${C.cvac}" stroke="${INK}" stroke-width="6"/>
        <path d="M-110 88 q12 -9 24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 M-80 108 q12 -9 24 0 t24 0 t24 0 t24 0 t24 0 t24 0" fill="none" stroke="${C.cvacWave}" stroke-width="4" stroke-linecap="round"/>
        ${shine(-92, -92, 40, 14, -32)}
        ${shine(-48, -118, 10, 5, -10)}
        ${face(0, 0, 2.3)}`;
    },
  };

  function roughER(cx, cy, radii, a0, a1, w) {
    let tubes = '', dots = '';
    radii.forEach((r, i) => {
      const A0 = a0 + i * 5, A1 = a1 - i * 5;

      const t = ac.currentTime + (delay || 0);
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      g.gain.setValueAtTime(vol || 0.12, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + dur + 0.02);
    } catch (e) { /* no audio available */ }

    cv.width = innerWidth; cv.height = innerHeight;
    const cols = ['#ff8fb8', '#ffd23f', '#8be36b', '#6cb8ff', '#a77bff', '#ff9f43'];
    for (let i = 0; i < 140; i++) {
      bits.push({ x: innerWidth / 2 + rnd(-80, 80), y: innerHeight * 0.35, vx: rnd(-9, 9), vy: rnd(-15, -5), r: rnd(5, 10), c: cols[i % cols.length], rot: rnd(0, 6), vr: rnd(-0.3, 0.3), round: Math.random() < 0.4 });
    }
    if (!confettiRunning) { confettiRunning = true; requestAnimationFrame(tick); }
  }
  function tick() {
    cx2.clearRect(0, 0, cv.width, cv.height);
    bits.forEach(b => {
      b.vy += 0.35; b.vx *= 0.99; b.x += b.vx; b.y += b.vy; b.rot += b.vr;
      cx2.save(); cx2.translate(b.x, b.y); cx2.rotate(b.rot);

      cx2.fill(); cx2.stroke(); cx2.restore();
    });
    bits = bits.filter(b => b.y < cv.height + 30);

      <path d="M36 140 q8 -14 22 -8 q8 -12 22 -2 q14 0 12 12 Z" fill="#fff" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
      <path d="M82 52 V184 M20 118 H144" stroke="${INK}" stroke-width="5"/>`;
    // chalkboard
    s += `<rect x="186" y="36" width="408" height="178" rx="12" fill="#a96535" stroke="${INK}" stroke-width="5"/>
      <rect x="200" y="50" width="380" height="150" rx="6" fill="#2f6b4f" stroke="${INK}" stroke-width="3"/>
      <rect x="230" y="210" width="320" height="10" rx="4" fill="#c9824a" stroke="${INK}" stroke-width="3"/>
      <rect x="260" y="203" width="18" height="7" rx="2" fill="#fff"/><rect x="290" y="203" width="14" height="7" rx="2" fill="#ffd23f"/>
      <g fill="#fff" font-family="'Baloo 2', 'Comic Sans MS', sans-serif" font-weight="800" text-anchor="middle" opacity=".92">
        <g class="board-part on" id="board-hello">
          <text x="390" y="112" font-size="38">Science Class</text>
          <text x="390" y="160" font-size="24" opacity=".8">Today: ???</text>
        </g>
        <g class="board-part" id="board-trip">
          <text x="390" y="104" font-size="46" fill="#ffe066">FIELD TRIP!</text>
        </g>
        <g class="board-part" id="board-cell">
          <ellipse cx="300" cy="158" rx="52" ry="27" fill="none" stroke="#fff" stroke-width="4"/>
          <circle cx="306" cy="156" r="11" fill="none" stroke="#fff" stroke-width="4"/>
          <path d="M270 150 q8 -6 14 0 M326 170 q8 -6 14 0" fill="none" stroke="#fff" stroke-width="3"/>
          <text x="458" y="170" font-size="30">to a CELL!</text>
        </g>
      </g>`;
    // clock + poster
    s += `<circle cx="690" cy="66" r="28" fill="#fff" stroke="${INK}" stroke-width="5"/>
      <path d="M690 66 V48 M690 66 L703 72" stroke="${INK}" stroke-width="4" stroke-linecap="round"/>
      <rect x="638" y="110" width="110" height="118" rx="8" fill="#fff" stroke="${INK}" stroke-width="4" transform="rotate(3 693 169)"/>
      <g transform="rotate(3 693 169)">
        <text x="693" y="136" text-anchor="middle" font-family="'Baloo 2', sans-serif" font-weight="800" font-size="17" fill="${INK}">CELLS!</text>
        <ellipse cx="693" cy="178" rx="38" ry="28" fill="#ffe9f2" stroke="${INK}" stroke-width="3"/>
        <circle cx="696" cy="176" r="11" fill="#a77bff" stroke="${INK}" stroke-width="2.5"/>
        <rect x="664" y="186" width="16" height="8" rx="4" fill="#ff9f43" stroke="${INK}" stroke-width="2"/>
      </g>`;
    s += teacherMarkup();
    // kid bodies, desks, hands
    KIDS.forEach(k => {
      const body = `<g class="kid" id="kid-${k.id}" transform="translate(${k.x} ${DESK_Y})">${kidMarkup(k)}</g>`;
      s += k.id === 'leo' ? `<g class="leo-spin" id="leo-spin-body">${body}</g>` : body;
    });
    KIDS.forEach(k => {
      s += `<g transform="translate(${k.x} ${DESK_Y})">${deskMarkup()}</g>`;
      s += `<g transform="translate(${k.x} 170)"><g class="yay" id="yay-${k.id}"><path d="M-38 -16 Q-38 -34 0 -34 Q38 -34 38 -16 Q38 2 6 2 L-2 14 L-6 2 Q-38 2 -38 -16Z" fill="#fff" stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/><text x="0" y="-8" text-anchor="middle" font-family="'Baloo 2', sans-serif" font-weight="800" font-size="20" fill="${INK}">${pick(['Yay!', 'Woo!', 'Yes!'])}</text></g></g>`;
    });
    KIDS.forEach(k => {
      if (k.id === 'leo') return;
      s += `<g class="kid-hands" id="hands-${k.id}" transform="translate(${k.x} ${DESK_Y})">${handsMarkup(k)}</g>`;
    });
    // vortex + machine + Leo's hands (on top so the press reads)
    s += `<g id="vortex" transform="translate(690 ${MACH_DESK_Y})"><g id="vortex-grow">
        <circle class="ring" r="150" fill="none" stroke="#b06bff" stroke-width="16" stroke-dasharray="80 50" stroke-linecap="round" opacity=".7"/>
        <circle class="ring r2" r="105" fill="none" stroke="#3bd5ff" stroke-width="14" stroke-dasharray="60 40" stroke-linecap="round" opacity=".8"/>
        <circle class="ring r3" r="62" fill="none" stroke="#ff8fb8" stroke-width="12" stroke-dasharray="40 26" stroke-linecap="round" opacity=".9"/>
        <circle class="ring r2" r="28" fill="none" stroke="#fff36b" stroke-width="10" stroke-dasharray="20 14" stroke-linecap="round"/>
      </g></g>`;
    s += `<g id="mach-pos"><g id="mach-hop"><g class="machine" id="machine">${machineMarkup()}</g></g></g>`;
    const leo = KIDS[3];
    s += `<g class="leo-spin" id="leo-spin-hands"><g class="kid-hands" id="hands-leo" transform="translate(${leo.x} ${DESK_Y})">${handsMarkup(leo, 'leo-hand')}</g></g>`;
    s += '</g>';
    return s;
  }

  // ---------- cinematic engine ----------
  const SKIP = { skip: true };
  const intro = { skipped: true, timers: [], advance: null, finishType: null, whirr: null };
  const scene = $('scene'), cine = $('cine'), subs = $('subs');
  const q1 = sel => scene.querySelector(sel);

  function later(ms, fn) { intro.timers.push(setTimeout(() => { if (!intro.skipped) fn(); }, ms)); }
  function iwait(ms) {
    return new Promise((res, rej) => {
      if (intro.skipped) return rej(SKIP);
      const t = setTimeout(done, ms);
      function done() { clearTimeout(t); intro.advance = null; intro.cancel = null; res(); }
      intro.cancel = () => { clearTimeout(t); rej(SKIP); };
    });
  }
  let voices = [];
  const FEM = /female|woman|samantha|victoria|zira|karen|moira|tessa|fiona|susan|aria|jenny|ava|allison|serena|kate|libby|sonia|emma|michelle|ana|joanna|salli|kimberly|ivy|nicky|zoe|siri.*voice [24]|google us english|google uk english female/i;
  const MALE = /\bmale|daniel|alex|david|guy|mark|tom|aaron|arthur|oliver|ryan|christopher|eric|roger|steffan|brian|matthew|justin|evan|google uk english male/i;
  // Novelty / formant-synth voices that sound robotic no matter what.
  const ROBOTIC = /albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|hysterical|jester|organ|pipe|princess|superstar|trinoids|whisper|wobble|zarvox|fred|ralph|junior|kathy|espeak|robot/i;
  function voiceScore(v) {
    const n = v.name;
    let s = 0;
    if (/natural|neural|online/i.test(n)) s += 60;        // Edge / Windows neural voices
    if (/premium|enhanced|siri/i.test(n)) s += 45;         // Apple high-quality voices
    if (/^google/i.test(n)) s += 35;                       // Chrome's cloud voices
    if (/samantha|ava|allison|serena|daniel|karen|moira|tessa/i.test(n)) s += 15;
    if (/^en[-_]us/i.test(v.lang)) s += 8; else if (/^en[-_](gb|au|ie|ca)/i.test(v.lang)) s += 5;
    if (!v.localService) s += 5;
    if (ROBOTIC.test(n)) s -= 200;
    return s;
  }
  function loadVoices() {
    try {
      voices = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang) && !ROBOTIC.test(v.name))
        .sort((a, b) => voiceScore(b) - voiceScore(a));
    } catch (e) { voices = []; }
  }
  if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
  // Pick the best-sounding voices of the right gender; `slot` spreads characters across
  // different voices so everyone doesn't sound like the same person.
  function pickVoice(female, slot) {
    if (!voices.length) return null;
    let pool = voices.filter(v => female ? FEM.test(v.name) : (MALE.test(v.name) && !FEM.test(v.name)));
    if (!pool.length) pool = voices;
    const best = voiceScore(pool[0]);
    const good = pool.filter(v => voiceScore(v) >= best - 25);
    return good[(slot || 0) % good.length];
  }
  // Break a line into sentence-sized chunks: gives natural breaths between sentences and
  // avoids Chrome cutting off long utterances.
  function speechChunks(text) {
    const clean = text
      .replace(/\s*[—–]\s*/g, ', ')
      .replace(/\.\.\.|…/g, ', ')
      .replace(/[*_~#]/g, '')
      .replace(/\s+/g, ' ').trim().replace(/,$/, '.');
    return (clean.match(/[^.!?]+[.!?]*["')\]]*/g) || [clean]).map(c => c.trim()).filter(Boolean);
  }
  function speak(who, text) {
    return new Promise(res => {
      if (!state.sound || !('speechSynthesis' in window)) return res();
      try {
        speechSynthesis.cancel();
        const v = SPEAKERS[who] || {};
        const voice = pickVoice(v.female, v.slot);
        const chunks = speechChunks(text);
        let left = chunks.length;
        if (!left) return res();
        const done = () => { if (--left <= 0) res(); };
        chunks.forEach((c, i) => {
          const u = new SpeechSynthesisUtterance(c);
          // Tiny per-sentence variation so delivery isn't perfectly flat; questions lift a touch.
          const jitter = (Math.random() - 0.5) * 0.06;
          u.pitch = Math.min(2, (v.pitch || 1) + jitter + (/\?$/.test(c) ? 0.04 : 0));
          u.rate = (v.rate || 1) * (/!$/.test(c) ? 1.04 : 1) * (i === 0 ? 1 : 0.99);
          if (voice) { u.voice = voice; u.lang = voice.lang; }
          u.onend = u.onerror = done;
          speechSynthesis.speak(u);
        });
        setTimeout(res, 2500 + text.length * 90);
      } catch (e) { res(); }
    });
  }
  function teacherTalking(on) { const t = q1('#teacher'); if (t) t.classList.toggle('talking', on); }

  // Show one line of dialogue: type it out, speak it, then hold. Tapping the scene speeds it up.
  function line(who, text, opts) {
    opts = opts || {};
    return new Promise((res, rej) => {
      if (intro.skipped) return rej(SKIP);
      subs.classList.add('on');
      const sp = SPEAKERS[who] || { color: '#fff' };
      subs.innerHTML = `<span class="speaker" style="background:${sp.color}">${esc(who)}</span><span id="subs-text"></span><span class="subs-hint">tap to speed up</span>`;
      const out = $('subs-text');
      teacherTalking(who === 'Ms. Rivera');
      let spoken = false;
      speak(who, text).then(() => { spoken = true; });
      let i = 0;
      const iv = setInterval(step, 30);
      function step() {
        if (intro.skipped) { clearInterval(iv); return rej(SKIP); }
        i++;
        out.textContent = text.slice(0, i);
        if (opts.onType) opts.onType(i / text.length);
        if (i >= text.length) { clearInterval(iv); typed(); }
      }
      intro.finishType = () => { i = text.length - 1; step(); };
      function typed() {
        intro.finishType = null;
        const start = Date.now();
        const hold = opts.hold == null ? 900 : opts.hold;
        const poll = setInterval(() => {
          if (intro.skipped) { clearInterval(poll); return rej(SKIP); }
          const waited = Date.now() - start;
          if ((waited >= hold && spoken) || waited >= hold + 6000) finish();
        }, 60);
        function finish() {
          clearInterval(poll);
          intro.advance = null;
          if (who === 'Ms. Rivera') teacherTalking(false);
          res();
        }
        intro.advance = () => { try { speechSynthesis.cancel(); } catch (e) {} spoken = true; finish(); };
      }
    });
  }

  function camTo(cx, cy, z) {
    const cam = q1('#cam');
    cam.style.transform = z === 1 ? '' : `translate(${400 - z * cx}px, ${225 - z * cy}px) scale(${z})`;
  }
  function moveMachine(x, y, hop) {
    const p = q1('#mach-pos');
    p.style.transform = `translate(${x}px, ${y}px)`;
    if (hop) {
      const h = q1('#mach-hop');
      h.classList.remove('hop'); void h.getBBox(); h.classList.add('hop');
      tone(500, 0.18, 'triangle', 0.08, 0, 900);
    }
  }
  function board(which) { ['hello', 'trip', 'cell'].forEach(b => { if (which.includes(b)) q1('#board-' + b).classList.add('on'); else q1('#board-' + b).classList.remove('on'); }); }
  function kids(cls, on, only) {
    KIDS.forEach(k => {
      if (only && !only.includes(k.id)) return;
      const body = q1('#kid-' + k.id), hands = q1('#hands-' + k.id);
      body.classList.toggle(cls, on);
      if (cls === 'cheer' && hands) hands.classList.toggle('cheer', on);
    });
  }
  function startWhirr() {
    if (!state.sound) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const t = ac.currentTime;
      const o = ac.createOscillator(), g = ac.createGain(), lfo = ac.createOscillator(), lg = ac.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(70, t);
      o.frequency.exponentialRampToValueAtTime(700, t + 4);
      lfo.frequency.value = 9; lg.gain.value = 40;
      lfo.connect(lg); lg.connect(o.frequency);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.05, t + 0.4);
      o.connect(g); g.connect(ac.destination);
      o.start(t); lfo.start(t);
      intro.whirr = { o, g, lfo };
    } catch (e) { /* no audio */ }
  }
  function stopWhirr() {
    const w = intro.whirr;
    if (!w) return;
    intro.whirr = null;
    try {
      const t = ac.currentTime;
      w.g.gain.cancelScheduledValues(t);
      w.g.gain.setValueAtTime(w.g.gain.value, t);
      w.g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
      w.o.stop(t + 0.35); w.lfo.stop(t + 0.35);
    } catch (e) { /* ignore */ }
  }

  function resetScene() {
    scene.innerHTML = sceneMarkup();
    subs.classList.remove('on');
    subs.innerHTML = '';
  }

  async function playIntro() {
    resetScene();
    intro.skipped = false;
    cine.classList.add('playing');
    $('cine-start').classList.add('hidden');
    const leoPressed = { done: false };
    try {
      await iwait(500);
      await line('Ms. Rivera', 'Good morning, class! Settle down, settle down. I have some very exciting news!');
      board(['trip']);
      await line('Ms. Rivera', 'Today... we are going on a FIELD TRIP!', { onType: p => { if (p >= 1) { kids('cheer', true); KIDS.forEach(k => q1('#yay-' + k.id).classList.add('on')); sfx.right(); } } });
      await line('Class', 'Yaaay! Is it the zoo? The aquarium? The candy factory?!');
      kids('cheer', false);
      KIDS.forEach(k => q1('#yay-' + k.id).classList.remove('on'));
      await line('Ms. Rivera', 'Even better! We’re going somewhere so tiny, you can’t even see it with your eyes.');
      q1('#teacher').classList.add('holding');
      moveMachine(MACH_TEACHER[0], MACH_TEACHER[1], false);
      q1('#mach-pos').classList.add('on');
      sfx.newFind();
      board(['trip', 'cell']);
      await line('Ms. Rivera', 'With this machine, the Micro-Explorer, we’re going to explore the inside of a CELL!');
      kids('wow', true);
      await line('Class', 'Ooooooh!', { hold: 500 });
      kids('wow', false);
      await line('Ms. Rivera', 'Go ahead and pass it around, carefully, so everyone gets a good look.', { hold: 300 });
      q1('#teacher').classList.remove('holding');
      moveMachine(KIDS[0].x, MACH_DESK_Y, true);
      await iwait(1000);
      await line('Maya', 'Whoa, it’s so shiny!', { hold: 400 });
      moveMachine(KIDS[1].x, MACH_DESK_Y, true);
      await iwait(1000);
      await line('Sam', 'Beep boop! I’m a robot scientist!', { hold: 400 });
      moveMachine(KIDS[2].x, MACH_DESK_Y, true);
      await iwait(1000);
      await line('Ruby', 'Here you go, Leo. Your turn!', { hold: 300 });
      moveMachine(KIDS[3].x, MACH_DESK_Y, true);
      camTo(640, 262, 2);
      await iwait(1400);
      await line('Leo', 'Cool! I wonder what this big red button does...');
      const press = () => {
        if (leoPressed.done) return;
        leoPressed.done = true;
        q1('#leo-hand').classList.add('press');
        later(480, () => {
          q1('#machine').classList.add('pressed', 'active');
          tone(1400, 0.06, 'square', 0.08);
          startWhirr();
        });
      };
      await line('Ms. Rivera', 'Now remember, class, this machine is only EXPERIMENTAL, so whatever you do, don’t press the—', { onType: p => { if (p >= 0.6) press(); }, hold: 200 });
      press();
      q1('#vortex').classList.add('on');
      await line('Ms. Rivera', '...red button.', { hold: 300 });
      q1('#leo-spin-body').classList.add('swept');
      q1('#leo-spin-hands').classList.add('swept');
      tone(1300, 1.6, 'triangle', 0.1, 0, 90);
      await line('Leo', 'WHOA-WHOA-WHOAAAAAA!', { hold: 900 });
      stopWhirr();
      q1('#vortex').classList.add('off');
      q1('#machine').classList.remove('active');
      camTo(400, 225, 1);
      kids('gasp', true, ['maya', 'sam', 'ruby']);
      await iwait(1300);
      await line('Class', 'LEO?!', { hold: 600 });
      await line('Ms. Rivera', 'Oh my. Well... it looks like Leo is going on our field trip a little early!');
      await line('Ms. Rivera', 'Hang on, Leo! Explore that cell, and we’ll figure out how to get you back!');
      $('flash').classList.add('on');
      await iwait(700);
    } catch (e) {
      if (e === SKIP) return;
      throw e;
    }
    finishIntro();
  }

  function finishIntro() {
    intro.skipped = true;
    intro.timers.forEach(clearTimeout); intro.timers = [];
    if (intro.cancel) { try { intro.cancel(); } catch (e) {} }
    intro.advance = intro.finishType = intro.cancel = null;
    try { speechSynthesis.cancel(); } catch (e) {}
    stopWhirr();
    cine.classList.remove('playing');
    $('cine-start').classList.remove('hidden');
    showTitleAfterStory();
    const fl = $('flash');
    fl.classList.add('on');
    setTimeout(() => fl.classList.remove('on'), 60);
  }
  function showTitleAfterStory() {
    renderTitle();
    showScreen('title');
  }

  cine.addEventListener('click', e => {
    if (intro.skipped || e.target.closest('button')) return;
    if (intro.finishType) intro.finishType();
    else if (intro.advance) intro.advance();
  });
  subs.addEventListener('click', () => {
    if (intro.skipped) return;
    if (intro.finishType) intro.finishType();
    else if (intro.advance) intro.advance();
  });
  $('cine-play').onclick = () => { sfx.pop(); playIntro(); };
  $('cine-skip0').onclick = () => { sfx.pop(); finishIntro(); };
  $('cine-skip').onclick = () => { sfx.pop(); finishIntro(); };
  $('replay-intro').onclick = () => { sfx.pop(); resetScene(); showScreen('intro'); };
  resetScene();

  renderTitle();
  // allow deep links like /cells/#plant
  const h = location.hash.replace('#', '');
  if (h === 'prokaryotic' || h === 'bacteria') startGame('prokaryote');
  else if (Object.prototype.hasOwnProperty.call(CELLS, h)) startGame(h);
  else if (h === 'eukaryotic') { showScreen('title'); setPickStep('eu'); }
})();
</script>
